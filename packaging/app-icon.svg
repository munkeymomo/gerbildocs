<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175FFF"/>
      <stop offset="1" stop-color="#23F9FF"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7C8"/>
      <stop offset="1" stop-color="#D9B57A"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#F3E6CC"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- page the gerbil sits on -->
  <g transform="translate(58 150)">
    <rect x="0" y="0" width="140" height="68" rx="8" fill="#ffffff" opacity=".92"/>
    <rect x="14" y="16" width="112" height="6" rx="3" fill="#175FFF" opacity=".55"/>
    <rect x="14" y="30" width="86" height="6" rx="3" fill="#175FFF" opacity=".35"/>
    <rect x="14" y="44" width="100" height="6" rx="3" fill="#175FFF" opacity=".35"/>
  </g>
  <!-- tail -->
  <path d="M182 152 C 214 150, 226 120, 208 96" fill="none" stroke="#C99A5B" stroke-width="9" stroke-linecap="round"/>
  <circle cx="207" cy="94" r="8" fill="#B8874A"/>
  <!-- body -->
  <ellipse cx="128" cy="126" rx="62" ry="46" fill="url(#fur)"/>
  <ellipse cx="126" cy="140" rx="36" ry="24" fill="url(#belly)"/>
  <!-- head -->
  <circle cx="96" cy="92" r="40" fill="url(#fur)"/>
  <!-- ears -->
  <circle cx="72" cy="58" r="15" fill="#D9B57A"/>
  <circle cx="72" cy="59" r="8" fill="#F4C9C2"/>
  <circle cx="118" cy="56" r="15" fill="#D9B57A"/>
  <circle cx="118" cy="57" r="8" fill="#F4C9C2"/>
  <!-- eyes -->
  <circle cx="84" cy="90" r="6.5" fill="#101828"/>
  <circle cx="86" cy="88" r="2" fill="#ffffff"/>
  <circle cx="112" cy="90" r="6.5" fill="#101828"/>
  <circle cx="114" cy="88" r="2" fill="#ffffff"/>
  <!-- nose and whiskers -->
  <ellipse cx="97" cy="106" rx="5.5" ry="4" fill="#E28C8C"/>
  <path d="M60 104 L84 108 M60 114 L84 111 M134 104 L110 108 M134 114 L110 111" stroke="#7A5A34" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- paws holding the page -->
  <ellipse cx="102" cy="154" rx="11" ry="7" fill="#D9B57A"/>
  <ellipse cx="150" cy="154" rx="11" ry="7" fill="#D9B57A"/>
</svg>
