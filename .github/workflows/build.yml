# Builds the Windows installer. This workflow is the reference way the .exe is
# produced: neither the authoring environment nor a typical development session
# has Windows, PyInstaller and Inno Setup together.
#
#   push to main / a v* tag / pull request / "Run workflow" button
#     -> test (Linux, fast)
#     -> build-windows: pytest, selfcheck, fetch MathJax, PyInstaller, Inno Setup,
#        a smoke run, and a run of the portable zip tagged as a download
#     -> artifacts: the installer, the portable zip, and every release file
#     -> "Run workflow" with "Publish a release" ticked, or a v* tag:
#        the GitHub release, with every file (docs/RELEASING.md)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in pyproject.toml"
        type: boolean
        default: false

permissions:
  contents: write   # only used by the release job

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (without the native window; not needed for tests)
        run: |
          grep -v -i pywebview requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Unit tests (services, no web framework)
        run: pytest
      - name: Self-check (the HTTP layer end to end)
        run: python -m app.selfcheck
      - name: Lint
        # Reported, not yet enforced: the lint rules pre-date most of the code.
        continue-on-error: true
        run: |
          ruff check .
          mypy app

  build-windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      # Check out with the repository's own line endings, so the source zip
      # and the standalone page match the repository byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest
      - name: Self-check
        run: python -m app.selfcheck
      - name: Fetch MathJax (bundled so equations work offline)
        run: python tools/fetch_mathjax.py
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build bundle and installer
        run: python packaging/build.py --clean --installer --zip
      - name: Smoke-run the built executable
        shell: pwsh
        run: |
          # It must start, answer on loopback with the injected token, and exit.
          $exe = "dist\GerbilDocs\GerbilDocs.exe"
          $env:DESK_TOKEN = "ci-smoke"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-open","--port","48111","--data-dir","$env:RUNNER_TEMP\gerbildocs-smoke" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:48111/api/health?t=ci-smoke" -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content -match '"ok":\s*true') { $ok = $true }
              } catch {}
            }
            if (-not $ok) { throw "the built executable did not answer /api/health within 30 s" }
            $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:48111/?t=ci-smoke" -TimeoutSec 5
            if ($page.Content -notmatch '__DESK_EDITION="desktop"') { throw "the served page is not the desktop edition" }
            "built executable answers; page served (" + $page.Content.Length + " bytes)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Run the portable zip the way a download arrives
        shell: pwsh
        run: |
          # Unzipped from a browser download with Explorer, every file carries a
          # Zone.Identifier stream, and .NET refuses tagged assemblies. 1.4.0
          # shipped a zip that failed exactly this way on everyone else's PC.
          # Tag a copy the same way; the window's runtime must still load.
          $zip = Get-ChildItem dist\GerbilDocs-*-win32.zip | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "as-downloaded"
          Expand-Archive $zip.FullName -DestinationPath $dir
          $tag = "[ZoneTransfer]`r`nZoneId=3`r`n"
          $files = Get-ChildItem $dir -Recurse -File
          $files | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value $tag }
          "tagged $($files.Count) files as downloaded"
          $exe = Get-ChildItem $dir -Recurse -Filter GerbilDocs.exe | Select-Object -First 1
          $data = Join-Path $env:RUNNER_TEMP "as-downloaded-data"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe.FullName
          $psi.Arguments = "--check-window --data-dir `"$data`""
          $psi.UseShellExecute = $false   # no Attachment Manager prompt for a tagged .exe
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--check-window did not finish within 2 minutes" }
          $out.Result; $err.Result
          Get-ChildItem $data -Recurse -Filter desk.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          if ($p.ExitCode -ne 0) { throw "the window's runtime does not load from a downloaded copy of the zip" }
      - name: Assemble the release files
        shell: pwsh
        run: |
          $ver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          New-Item -ItemType Directory -Force "release\$ver" | Out-Null
          Copy-Item dist\installer\*.exe "release\$ver\"
          python tools/make_release.py --skip-build
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: GerbilDocs-release
          path: release/
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GerbilDocs-installer
          path: dist/installer/*.exe
          if-no-files-found: error
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: GerbilDocs-portable
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GerbilDocs-release
          path: out
      - name: Version, notes and files
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $ver in pyproject.toml"; exit 1
          fi
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "::error::release v$ver already exists; bump the version"; exit 1
          fi
          if [ ! -f "RELEASE-NOTES-$ver.md" ]; then
            echo "::error::RELEASE-NOTES-$ver.md is missing; it is the release's body"; exit 1
          fi
          ls -l "out/$ver"
          (cd "out/$ver" && sha256sum -c SHA256SUMS.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      # A draft first, with every file on it, then published. SourceForge's
      # GitHub sync copies a release when it is published and does not see
      # files added afterwards. Publishing creates the tag at this commit.
      - name: Create the release as a draft, with every file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GerbilDocs ${{ steps.v.outputs.version }}
          body_path: RELEASE-NOTES-${{ steps.v.outputs.version }}.md
          draft: true
          files: out/${{ steps.v.outputs.version }}/*
          fail_on_unmatched_files: true
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ steps.v.outputs.version }}" --draft=false --latest
