<style>
:root{
  --ink:#0C1222; --body:#333C52; --muted:#6A748C; --faint:#98A1B5;
  --paper:#FFFFFF; --ground:#F7F8FB; --panel:#FFFFFF; --sunk:#F0F2F7;
  --line:#E6E9F0; --line-strong:#CDD3DF;
  --brand:#175FFF; --brand-ink:#0E45C4; --brand-wash:#EDF2FF; --spark:#23F9FF;
  --ok:#0F7A57; --ok-wash:#E8F5EF; --warn:#9A6206; --warn-wash:#FCF2E2; --crit:#B62B36; --crit-wash:#FCEBEC;
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --r:8px; --r-lg:12px; --r-sm:6px;
  --shadow:0 1px 2px rgba(12,18,34,.04), 0 1px 3px rgba(12,18,34,.04);
  --shadow-lg:0 2px 4px rgba(12,18,34,.04), 0 12px 32px -8px rgba(12,18,34,.16);
  --ring:0 0 0 3px rgba(23,95,255,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F0F3FA; --body:#C8D0E2; --muted:#8B95AC; --faint:#69738A;
  --paper:#141925; --ground:#0B0E16; --panel:#141925; --sunk:#1B2130;
  --line:#242B3B; --line-strong:#353D51;
  --brand:#5C8CFF; --brand-ink:#A3C0FF; --brand-wash:#182548; --spark:#23F9FF;
  --ok:#4FCB95; --ok-wash:#112C22; --warn:#E0A64A; --warn-wash:#2C2313; --crit:#F0808A; --crit-wash:#31171B;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -12px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(92,140,255,.28);
}}
:root[data-theme="dark"]{
  --ink:#F0F3FA; --body:#C8D0E2; --muted:#8B95AC; --faint:#69738A;
  --paper:#141925; --ground:#0B0E16; --panel:#141925; --sunk:#1B2130;
  --line:#242B3B; --line-strong:#353D51;
  --brand:#5C8CFF; --brand-ink:#A3C0FF; --brand-wash:#182548; --spark:#23F9FF;
  --ok:#4FCB95; --ok-wash:#112C22; --warn:#E0A64A; --warn-wash:#2C2313; --crit:#F0808A; --crit-wash:#31171B;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -12px rgba(0,0,0,.75);
  --ring:0 0 0 3px rgba(92,140,255,.28);

}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--sans);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{color:var(--ink);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:color-mix(in srgb, var(--panel) 88%, transparent);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tb1{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
.mark{display:flex;align-items:center;gap:9px;flex-shrink:0}
.mark .glyph{width:30px;height:30px;border-radius:7px;display:block;box-shadow:var(--shadow)}
.mark b{color:var(--ink);font-weight:600;font-size:13px;letter-spacing:-.01em}
.mark span{color:var(--faint);font-size:11px;display:block;line-height:1.2;letter-spacing:.04em;text-transform:uppercase}
.docid{display:flex;align-items:baseline;gap:8px;min-width:170px;flex:1 1 170px}
#btnUndo,#btnRedo{padding-left:9px;padding-right:9px;font-size:15px;line-height:1}
.docid .t{font-weight:600;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:90px}
.docid .chip,.docid .btn{flex-shrink:0}
#docDir{max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
@media(max-width:1200px){#docDir{display:none}}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.subtabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto;flex:1;min-width:0}
.tb2{display:flex;align-items:center;gap:10px}
.stylerow{display:flex;align-items:center;gap:7px;padding:0 16px 6px}
.stylerow .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.stylerow select{width:auto;max-width:280px;padding:4px 8px;font-size:12px}
.subtab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px 9px;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.subtab:hover{color:var(--ink)}
.subtab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
.subtab .dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.subtab[aria-selected="true"] .dot{background:var(--spark)}
.main{display:flex;flex:1;min-height:0}
.rail{width:186px;flex-shrink:0;border-right:1px solid var(--line);background:var(--ground);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:12px 8px 5px}
.navi{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:999px;background:none;border:0;width:100%;text-align:left;cursor:pointer;color:var(--muted);font-size:13px;transition:background .12s,color .12s}
.navi:hover{background:var(--sunk);color:var(--ink)}
.navi[aria-current="page"]{background:var(--brand);color:#fff;font-weight:500;box-shadow:var(--shadow)}
.navi[aria-current="page"] .ct{color:rgba(255,255,255,.72)}
.navi .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ---------- section levels and folding ---------- */
.secfold{background:none;border:0;cursor:pointer;color:var(--faint);font-size:11px;line-height:1;
  padding:3px 4px;border-radius:4px;flex-shrink:0;transition:transform .12s,color .12s}
.secfold:hover{color:var(--ink);background:var(--sunk)}
.secfold[aria-expanded="false"]{transform:rotate(-90deg)}
.panel[data-sec].folded > .bd{display:none}
.panel[data-sec].lv2{margin-left:20px;border-left:2px solid var(--brand-wash)}
.panel[data-sec].lv3{margin-left:40px;border-left:2px solid var(--line)}
.lvsel{width:auto;max-width:132px;padding:3px 6px;font-size:11.5px}
.secfold .n{display:inline-block;width:1em}

.work{flex:1;min-width:0;padding:18px 20px 60px}
.viewhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.viewhead h2{font-size:20px;letter-spacing:-.02em}
.viewhead .sub{color:var(--muted);font-size:12.5px;max-width:60ch}
.viewhead .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

/* ---------- credit bar ---------- */
.creditbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 18px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:11px;color:var(--muted);letter-spacing:.01em}
.creditbar b{color:var(--ink);font-weight:600}
.creditbar .right{margin-left:auto;display:flex;gap:6px;align-items:center}

/* ---------- preview overlay ---------- */
.pvwrap{position:fixed;inset:0;background:var(--ground);z-index:95;display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pvbar .acts{margin-left:auto;display:flex;gap:7px}
.pvbody{flex:1;overflow:auto;padding:26px 16px 60px;display:flex;justify-content:center;align-items:flex-start}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);width:min(820px,100%);padding:44px 52px 60px}
@media(max-width:760px){.sheet{padding:24px 20px 40px}}
.sheet .ms{max-width:none}
/* ---------- paginated pages ----------
   A .page is a real sheet at its true size in millimetres; the body inside is
   the type area, set in columns when the format asks for them. The screen
   scales the stack with `zoom`; print gets it at 1:1 with @page margins of
   zero, so what you see is what the PDF is. */
.pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.page{position:relative;background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 28px -8px rgba(0,0,0,.28);box-sizing:border-box;overflow:hidden;flex-shrink:0}
.page .pghead,.page .pgfoot{position:absolute;left:var(--pg-ml);right:var(--pg-mr);font-family:var(--f-hf-font,var(--sans));font-size:var(--f-hf-size,8pt);color:var(--f-hf-col,#444)}
.page .pghead{top:var(--pg-hg)}
.page .pgfoot{bottom:var(--pg-fg)}
.page .pghead .pgband.head{border-bottom:1px solid #999;padding-bottom:3px;margin:0}
.page .pgfoot .pgband.foot{border-top:1px solid #999;padding-top:3px;margin:0}
.page .pgband{color:inherit;font-family:inherit;font-size:inherit}
.page .pgband img{max-height:9mm}
.page .pgbody{position:absolute;left:var(--pg-ml);right:var(--pg-mr);top:var(--pg-bt);height:var(--pg-bh);column-fill:auto;column-gap:var(--pg-cg,6mm);column-count:var(--pg-cols,1);overflow:hidden}
.page .pgbody.showcols{background:none}
.page .pgnum{position:absolute;bottom:4mm;right:6mm;font-size:8px;color:#bbb;font-family:var(--mono)}
.page .ms{max-width:none;color:#000}
.page .ms .authorline,.page .ms .afflist,.page .ms .abstract,.page .ms h1,.page .ms .keywords,.page .ms .objbox{column-span:all}
.page .ms .authorline{color:var(--f-au-col,#222)}
.page .ms .afflist{color:var(--f-aff-col,#333)}
.page .ms .keywords{color:#333}
.page .ms .cite,.page .ms .xref{color:inherit;font-family:inherit;font-size:inherit;font-weight:inherit}
.page .ms .sref,.page .ms .aref{border:0;background:none}
.page .ms .unres{background:none;color:#b00;font-family:inherit;font-size:inherit}
.page .ms .slot{border:0;background:none;cursor:default}
.page .ms .slot .letter{background:none}
.page .ms .figframe{border:0;padding:0;background:none}
.page .ms .gridwrap{border:0;overflow:hidden}
.page .ms table.pubtable{width:100%;table-layout:auto}
.page .ms table.pubtable th,.page .ms table.pubtable td{padding:2pt 4pt;white-space:normal;overflow-wrap:anywhere}
.page .ms figure.tblfig.fig-single{max-width:none}
.page .ms figure.fig-single{max-width:none}
.page[style*="--pg-cols:1"] .ms figure.fig-single{max-width:58%}
.page .ms .figplace{display:none}
.page .ms .affnotes{position:absolute;bottom:0;left:0;width:var(--pg-colw,100%);max-width:none;border-top-color:#000;margin:0;background:#fff}
.page .ms .bib li{color:inherit}
.page .ms .eqrow{break-inside:avoid}
.page .ms h2,.page .ms h3{break-after:avoid;break-inside:avoid}
.page .ms p{orphans:2;widows:2}
.page .ms figure,.page .ms table{break-inside:avoid}
.page .ms .colbreak{break-before:column}
.pvzoom{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.pvzoom button{padding:2px 7px}
.pvstat{font-size:11.5px;color:var(--muted);white-space:nowrap}
#pgHost{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}
#pgHost .page{box-shadow:none}
/* The header and footer a template carries, drawn on the preview sheet the way
   they will be set on the page. */
.pgband{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:11px;color:var(--muted)}
.pgband > div{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgband .c{text-align:center}.pgband .r{text-align:right}
.pgband img{max-height:34px;width:auto;flex:0 0 auto}
.sheet .pgband.head{border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin-bottom:20px}
.sheet .pgband.foot{border-top:1px solid var(--line-strong);padding-top:8px;margin-top:26px}
.hfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:700px){.hfgrid{grid-template-columns:1fr}}
.pvtabs{display:flex;gap:2px;overflow-x:auto}
.pvtabs button{background:none;border:1px solid transparent;border-radius:var(--r);padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pvtabs button[aria-pressed="true"]{background:var(--brand-wash);color:var(--brand-ink);border-color:var(--brand)}

/* ---------- edition chips ---------- */
.chip.desk{background:var(--brand-wash);color:var(--brand-ink)}
#saveChip.dirty{background:var(--warn-wash);color:var(--warn)}
#saveChip.saving{background:var(--sunk);color:var(--muted)}
#saveChip.saved{background:var(--ok-wash);color:var(--ok)}
#saveChip.error{background:var(--crit-wash);color:var(--crit)}
#saveChip.none{background:var(--warn-wash);color:var(--warn)}
/* ---------- documents picker & start screen (desktop edition only) ---------- */
.doclist{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.docrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.docrow.cur{border-color:var(--brand);background:var(--brand-wash)}
.docrow .meta{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.docrow .acts{display:flex;gap:6px;flex-shrink:0}
.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
/* Specificity matters: the `.btn` rule below sets white-space:nowrap, and a
   bare `.startcard` selector loses to it on source order. These cards wrap. */
.btn.startcard{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px;padding:14px;text-align:left;white-space:normal;height:100%;min-width:0;line-height:1.35}
.btn.startcard b{font-size:13px}
.btn.startcard small{color:var(--muted);font-weight:400;line-height:1.45;white-space:normal;display:block}
.libnode{margin-top:6px}
.libnode>button{background:var(--sunk)}
.galnote{padding:7px 15px;border-bottom:1px dashed var(--line);background:var(--sunk);font-size:11.5px;color:var(--muted);line-height:1.45}
.galnote b{color:var(--ink);font-weight:600}
.notices{margin:0;padding-left:18px;font-size:13px}
.notices li{margin:4px 0}
.chip.web{background:var(--ok-wash);color:var(--ok)}
.edtable{width:100%;border-collapse:collapse;font-size:12.5px}
.edtable th,.edtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.edtable th{color:var(--faint);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em}
.edtable td:first-child{color:var(--ink)}
/* The deposit browser: folders that fold, one row per planned file. */
.dgroup{margin-top:6px}
.dgroup>button{width:100%;justify-content:flex-start;gap:8px;background:var(--sunk)}
.dkids{margin:4px 0 8px 11px;padding-left:12px;border-left:1px solid var(--line)}
.dnode{display:flex;gap:9px;align-items:center;padding:1.5px 4px;border-radius:3px;min-height:24px}
.dnode:hover{background:var(--sunk)}
.dname{font-family:var(--mono);font-size:12px;color:var(--body)}
.drole{color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dend{margin-left:auto;display:flex;gap:7px;align-items:center;flex:0 0 auto}
.dsum{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dprevbody{max-height:58vh;overflow:auto}
.dprevbody svg{max-width:100%;height:auto}
.dprevbody pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:0}

/* ---------- controls ---------- */
.btn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6.5px 12px;cursor:pointer;color:var(--ink);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--shadow);transition:border-color .12s,background .12s,color .12s}
a.btn{text-decoration:none}
.btn:hover{border-color:var(--line-strong);background:var(--sunk)}
.btn:active{transform:translateY(.5px)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(23,95,255,.32)}
.btn.p:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.sm{padding:3.5px 9px;font-size:11.5px;box-shadow:none}
.btn.danger:hover{border-color:var(--crit);color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;width:100%;font-size:13px;transition:border-color .12s,box-shadow .12s}
.inp:hover{border-color:var(--muted)}
.inp:focus{border-color:var(--brand);box-shadow:var(--ring);outline:none}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2.5px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap;letter-spacing:.01em}
.chip.b{background:var(--brand-wash);color:var(--brand-ink)}
.chip .chipx,.chip .chipmv{border:0;background:transparent;color:inherit;cursor:pointer;font:inherit;line-height:1;padding:0 1px;opacity:.65;border-radius:3px}
.chip .chipx:hover,.chip .chipmv:hover{opacity:1;background:rgba(0,0,0,.08)}
.chip .chipmv[disabled]{opacity:.22;cursor:default;background:transparent}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.crit{background:var(--crit-wash);color:var(--crit)}
.chip.demo{background:var(--sunk);color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.mono{font-family:var(--mono)}
.key{font-family:var(--mono);font-size:11.5px;color:var(--brand-ink);background:var(--brand-wash);padding:1px 5px;border-radius:3px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:30px;text-align:center;color:var(--muted);font-size:13px;background:var(--sunk)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel>header{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.panel>header h3{font-size:13px}
.panel>header .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel .bd{padding:15px}
.cols{display:grid;gap:16px;align-items:start}
.c-60-40{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.c-30-70{grid-template-columns:minmax(0,260px) minmax(0,1fr)}
.c-50-50{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)!important}}
.stack{display:flex;flex-direction:column;gap:10px}
.sticky{position:sticky;top:92px}
/* The section list runs to several screens, and a new heading was only ever
   reachable from the top of the view. This strip rides with the text. */
.secbar{position:sticky;top:84px;z-index:20;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  margin:0 0 10px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;
  background:color-mix(in srgb, var(--panel) 92%, transparent);backdrop-filter:saturate(1.5) blur(10px)}
.secbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-right:2px}
.secbar .where{margin-left:auto;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24ch}

/* ---------- lists ---------- */
.lst{display:flex;flex-direction:column}
.lst>li{list-style:none;border-bottom:1px solid var(--line);padding:10px 15px;display:flex;gap:10px;align-items:flex-start;transition:background .12s}
.lst>li:hover{background:var(--sunk)}
.lst>li:last-child{border-bottom:0}
.lst>li.sel,.lst>li.sel:hover{background:var(--brand-wash);box-shadow:inset 3px 0 0 var(--brand)}
ul.lst{margin:0;padding:0}
.lst .grow{flex:1;min-width:0}
.lst .ttl{color:var(--ink);font-weight:500;font-size:13px}
.lst .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.lst .acts{display:flex;gap:5px;flex-shrink:0}

/* ---------- manuscript preview ----------
   Typography comes from the document's format (docFormat()) as custom
   properties set on the .ms element by formatVars(); the values here are the
   fallbacks for a surface that has none. A word longer than the line — a URL,
   a SMILES string, a run of characters — wraps rather than leaving the page. */
.ms{font-family:var(--f-body-font,var(--serif));font-size:var(--f-body-size,15.5px);line-height:var(--f-body-lh,1.62);color:var(--f-body-col,var(--ink));max-width:66ch;
  overflow-wrap:anywhere;word-break:normal;hyphens:var(--f-hyphens,manual);text-align:var(--f-align,left)}
.ms.galley{font-size:calc(var(--f-body-size,15.5px) * var(--f-galley,1.35))}
.ms h1{font-family:var(--f-title-font,var(--serif));font-size:var(--f-title-size,22px);font-weight:var(--f-title-weight,600);color:var(--f-title-col,var(--ink));line-height:1.25;margin-bottom:10px;text-align:var(--f-title-align,left);text-wrap:balance}
.ms h2{font-family:var(--f-h1-font,var(--serif));font-size:var(--f-h1-size,16px);font-weight:var(--f-h1-weight,600);color:var(--f-h1-col,var(--ink));text-transform:var(--f-h1-tt,none);font-style:var(--f-h1-style,normal);margin:1.4em 0 .45em;text-align:left;letter-spacing:var(--f-h1-ls,-.01em)}
.ms h2::before{content:var(--f-h1-mark,"");margin-right:.4em}
.ms h3{font-family:var(--f-h2-font,var(--serif));font-size:var(--f-h2-size,14.5px);font-style:var(--f-h2-style,italic);font-weight:var(--f-h2-weight,600);color:var(--f-h2-col,var(--ink));margin:1.1em 0 .35em;text-align:left}
.ms .runin{font-weight:var(--f-h3-weight,600);font-style:var(--f-h3-style,italic);font-family:var(--f-h3-font,inherit)}
.ms p{margin:0 0 var(--f-para-gap,11px);text-indent:var(--f-para-indent,0)}
.ms p.cont{text-indent:0}
.ms .objbox{border:1px solid var(--f-accent,#000);border-left:4px solid var(--f-accent,#000);background:var(--f-objbox-bg,rgba(23,95,255,.06));padding:.6em .9em;margin:0 0 1.2em;font-size:.94em}
.ms .objbox h4{font-family:var(--f-h1-font,inherit);font-size:1em;margin:0 0 .3em;color:var(--f-h1-col,inherit)}
.ms .objbox ol{margin:0;padding-left:1.4em}
.ms .objbox li{margin:0 0 .2em}
.ms .wpref{font-weight:600;font-family:var(--f-h1-font,inherit)}
.ms .abstract{font-family:var(--f-abs-font,inherit);font-size:var(--f-abs-size,.94em);color:var(--f-abs-col,inherit)}
.ms .abstract.box{border:1px solid var(--f-rule,#000);padding:.6em .9em;border-left-width:1px}
.ms .abstract.rule{border-left:3px solid var(--f-rule,var(--line-strong));padding-left:12px}
.ms .abstract.plain{border:0;padding:0}
.ms .abstract .abslabel{font-weight:700;font-family:var(--f-h1-font,inherit)}
.ms .keywords{font-size:.85em;color:var(--muted)}
.ms .gantt{margin:0 0 1em}
.ms .gantt svg{width:100%;height:auto;display:block}
.ms ul,.ms ol{margin:0 0 11px;padding-left:24px}
.ms li{margin:0 0 4px}
.ms u{text-decoration:underline;text-underline-offset:2px}
.ms sub{font-size:.7em;vertical-align:sub;line-height:0}
.ms .authorline{font-size:var(--f-au-size,13.5px);color:var(--f-au-col,var(--body));margin-bottom:4px;font-family:var(--f-au-font,var(--sans));font-style:var(--f-au-style,normal);text-align:var(--f-title-align,left);text-indent:0}
.ms .secnum{margin-right:.15em}
.ms .afflist{font-size:var(--f-aff-size,11.5px);color:var(--f-aff-col,var(--muted));font-family:var(--f-aff-font,var(--sans));margin-bottom:16px;line-height:1.45;text-align:var(--f-title-align,left);text-indent:0}
/* RSC files the addresses as footnotes at the foot of the first column. In
   the galley they sit below the abstract, ruled off; on the page they are
   set at the foot of the first page. */
.ms .affnotes{font-size:var(--f-aff-size,10.5px);color:var(--f-aff-col,var(--muted));font-family:var(--f-aff-font,var(--sans));line-height:1.45;font-style:var(--f-aff-style,normal);
  border-top:1px solid var(--f-rule,var(--line-strong));padding-top:7px;margin:0 0 18px;max-width:34em;text-align:left;text-indent:0}
.ms .bib{font-family:var(--f-ref-font,var(--sans));font-size:var(--f-ref-size,12.5px);color:var(--f-ref-col,inherit);text-align:left}
.ms .figcap{font-family:var(--f-cap-font,var(--serif));font-size:var(--f-cap-size,13px);color:var(--f-cap-col,var(--ink));text-align:var(--f-cap-align,left);text-indent:0}
.ms .figcap b{font-family:var(--f-cap-font,var(--sans));font-size:inherit;font-weight:var(--f-cap-label-weight,600)}
.ms table.pubtable{font-family:var(--f-tbl-font,inherit);font-size:var(--f-tbl-size,12.5px);color:var(--f-tbl-col,inherit);text-align:left}
.ms .eqnum{font-family:var(--f-body-font,var(--serif))}
.ms sup{font-size:.7em;vertical-align:super;line-height:0}
.cite{color:var(--brand-ink);cursor:help;font-family:var(--sans);font-size:.82em}
.xref{color:var(--brand-ink);font-weight:600;font-family:var(--sans);font-size:.9em}
.unres{background:var(--crit-wash);color:var(--crit);border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:.78em}
.bib{font-family:var(--sans);font-size:12.5px;line-height:1.5}
.bib li{margin-bottom:6px;color:var(--body)}
.bib ol{padding-left:22px;margin:0}

/* ---------- figure composer ---------- */
.layoutgrid{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.lopt{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--panel);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center}
.lopt:hover{border-color:var(--brand)}
.lopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-wash);box-shadow:inset 0 0 0 1px var(--brand)}
.lopt .mini{width:100%;display:grid;gap:2px;height:38px}
.lopt .mini i{background:var(--line-strong);border-radius:2px;display:block}
.lopt[aria-pressed="true"] .mini i{background:var(--brand)}
.lopt small{font-size:10px;color:var(--muted);font-family:var(--mono)}
.figframe{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px}
.figgrid{display:grid;gap:8px}
.slot{position:relative;border:1px solid var(--line);border-radius:4px;background:var(--paper);min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.slot.vacant{border-style:dashed;color:var(--faint);font-size:11.5px;background:var(--sunk)}
.slot:hover{border-color:var(--brand)}
.slot .letter{position:absolute;top:4px;left:5px;font-family:var(--sans);font-weight:600;font-size:12px;color:var(--ink);background:var(--paper);border-radius:3px;padding:0 4px;z-index:2}
.slot svg,.slot img{width:100%;height:100%;min-height:0;object-fit:contain;display:block}
.figcap{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--ink);margin-top:9px}
/* A single-column figure is drawn at its real relative width so the caption
   length against the artwork is honest, not just a label saying "single". */
figure.fig-single{max-width:58%}
/* Half-width figures the text wraps around. RSC forbids wrapping; ACS and most
   reports allow it. Cleared on the galley so a short paragraph after it does
   not leave the caption hanging. */
figure.fig-wrapright{float:right;width:50%;max-width:50%;margin:0 0 .6em 1.2em!important}
figure.fig-wrapleft{float:left;width:50%;max-width:50%;margin:0 1.2em .6em 0!important}
.ms h2,.ms h3{clear:both}
figure.fig-top{border-bottom:1px solid var(--f-rule,var(--ink));padding-bottom:8px}
figure.fig-bottom{border-top:1px solid var(--f-rule,var(--ink));padding-top:8px}
figure.fig-double{column-span:all}
.slot .sub{position:absolute;right:4px;bottom:3px;font-size:9px;color:var(--faint);font-family:var(--mono)}
/* custom grid builder */
.gridbuild{display:flex;flex-direction:column;gap:5px}
.gridbuild .gbrow{display:flex;gap:6px;align-items:center}
.gridbuild .gbrow .lab{font-size:11px;color:var(--muted);width:44px}
.gridbuild .gbrow .seg{flex:0 0 auto}
.figplace{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);margin-bottom:4px}
.figcap b{font-family:var(--sans);font-size:12px;font-weight:600}

/* ---------- data grid ---------- */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.dg{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
table.dg th,table.dg td{border:1px solid var(--line);padding:0;min-width:88px}
table.dg th{background:var(--sunk)}
table.dg th input{border:0;background:none;padding:5px 7px;width:100%;font-weight:500;font-family:var(--sans);font-size:11.5px;color:var(--ink)}
table.dg td input{border:0;background:none;padding:5px 7px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
table.dg td input:focus{background:var(--brand-wash);outline-offset:-2px}
table.dg .rh{background:var(--sunk);color:var(--faint);text-align:center;min-width:32px;font-size:10.5px;padding:0 4px}
.symbar{display:flex;flex-wrap:wrap;gap:3px}
.symbar button{width:26px;height:24px;border:1px solid var(--line);background:var(--paper);border-radius:4px;cursor:pointer;font-size:12px;line-height:1;padding:0;color:var(--ink)}
.symbar button:hover{border-color:var(--brand);background:var(--brand-wash)}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brand)}

/* ---------- diff / review ---------- */
.diff{font-family:var(--serif);font-size:14px;line-height:1.7;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:440px;overflow:auto}
.diff ins{background:var(--ok-wash);color:var(--ok);text-decoration:none;border-bottom:1px solid var(--ok);padding:0 1px}
.diff del{background:var(--crit-wash);color:var(--crit);padding:0 1px}
.revrail{border-left:2px solid var(--line);padding-left:0;margin:0;list-style:none}
.revrail li{position:relative;padding:0 0 14px 18px}
.revrail li::before{content:"";position:absolute;left:-6px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--line-strong);border:2px solid var(--panel)}
.revrail li.cur::before{background:var(--spark);box-shadow:0 0 0 2px var(--brand)}
.rvcomment{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r);background:var(--panel)}
.rvcomment.done{border-left-color:var(--ok)}
.rvcomment.reb{border-left-color:var(--brand)}
.rvcomment blockquote{margin:0;padding:10px 12px;background:var(--sunk);font-family:var(--serif);font-size:13.5px;color:var(--ink);line-height:1.55}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:90;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);width:min(760px,100%);max-height:92vh;overflow:auto}
.modal>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);z-index:2}
.modal>footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
.modal .bd{padding:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:12.5px;z-index:120;box-shadow:var(--shadow-lg);font-weight:500;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast .toastbtn{background:none;border:0;color:var(--spark);font:inherit;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:4px;white-space:nowrap}
.toast .toastbtn:hover{text-decoration:underline}
.toast kbd{font-family:var(--mono);font-size:10.5px;opacity:.7}

/* ---------- skip link, landmarks ---------- */
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--brand);color:#fff;padding:8px 14px;border-radius:var(--r);font-weight:500}
.skip:focus{left:8px;outline:none;box-shadow:var(--ring)}
.work:focus{outline:none}

/* ---------- command palette ---------- */
.pal{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:min(12vh,90px) 16px 16px}
.palbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:min(70vh,560px);display:flex;flex-direction:column;overflow:hidden}
.palbox input{border:0;background:none;padding:14px 18px;font-size:15px;width:100%;color:var(--ink);border-bottom:1px solid var(--line)}
.palbox input:focus{outline:none;box-shadow:none}
.pallist{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
.pallist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--ink)}
.pallist li[aria-selected="true"]{background:var(--brand-wash);color:var(--brand-ink)}
.pallist li .kind{flex:0 0 96px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);white-space:nowrap}
.pallist li .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pallist li .lab mark{background:none;color:var(--brand);font-weight:600}
.pallist li .hint{font-size:11px;color:var(--muted);white-space:nowrap}
.pallist .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:8px 10px 3px}
.palfoot{border-top:1px solid var(--line);padding:6px 14px;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
kbd.k{font-family:var(--mono);font-size:10.5px;background:var(--sunk);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--body)}

  const a=r.authors.map(x=>{const n=splitName(x);return `${initials(n.first)} ${n.last}`;});
  if(a.length>6) return a.slice(0,6).join(", ")+", et al.";
  return a.length>1 ? a.slice(0,-1).join(", ")+", and "+a[a.length-1] : a[0]||"";

function authHarvard(r){
  const a=r.authors.map(x=>{const n=splitName(x);
    return `${n.last}, ${initials(n.first).replace(/\s+/g,"")}`;});
  return a.length>1 ? a.slice(0,-1).join(", ")+" and "+a[a.length-1] : a[0]||"";

  const a=r.authors.map(x=>{const n=splitName(x);

function toggleLines(ta, kind){
  if(!ta) return;
  const v=ta.value, a=ta.selectionStart??0, b=ta.selectionEnd??a;
  const from=v.lastIndexOf("\n",Math.max(0,a-1))+1;
  let to=v.indexOf("\n",b); if(to<0) to=v.length;
  const lines=v.slice(from,to).split("\n");
  const marked = kind==="ul" ? l=>/^\s*[-\u2022]\s+/.test(l) : l=>/^\s*\d+[.)]\s+/.test(l);
  const allMarked = lines.some(l=>l.trim()) && lines.every(l=>!l.trim()||marked(l));
  let n=0;
  const out=lines.map(l=>{
    if(!l.trim()) return l;
    const bare=l.replace(/^\s*(?:[-\u2022]|\d+[.)])\s+/,"");
    if(allMarked) return bare;
    n++; return kind==="ul" ? "- "+bare : n+". "+bare;
  }).join("\n");
  ta.value=v.slice(0,from)+out+v.slice(to);
  ta.dispatchEvent(new Event("input",{bubbles:true}));
  ta.focus(); ta.setSelectionRange(from,from+out.length);
}
function fmtKey(e){
  const ta=e.target; if(!(e.ctrlKey||e.metaKey)||e.altKey) return false;
  const k=(e.key||"").toLowerCase();
  if(e.shiftKey){
    /* The +/= key and the -/_ key, whichever character the layout reports. */
    if(e.key==="+"||e.key==="="){ e.preventDefault(); wrapSel(ta,"^{","}"); return true; }
    if(e.key==="_"||e.key==="-"){ e.preventDefault(); wrapSel(ta,"_{","}"); return true; }
    return false;
  }
  if(k==="b"){ e.preventDefault(); wrapSel(ta,"**","**"); return true; }
  if(k==="i"){ e.preventDefault(); wrapSel(ta,"*","*"); return true; }
  if(k==="u"){ e.preventDefault(); wrapSel(ta,"__","__"); return true; }
  return false;
}

/* ============================ FIGURES ============================ */
/* Where a figure sits on the page, and how wide it is. RSC and ACS both ask
   for figures collected at the top or bottom of a column, ruled off from the
   text; both also distinguish a single-column figure from a double. */
const FIG_PLACEMENTS = [
  {k:"inline", l:"In line, where it appears"},
  {k:"top",    l:"Top of page, ruled below"},
  {k:"bottom", l:"Bottom of page, ruled above"}
];
const FIG_SPANS = [{k:"single", l:"Single column"}, {k:"double", l:"Double column (full width)"},
  {k:"wrapright", l:"Half width, text wraps on the left"}, {k:"wrapleft", l:"Half width, text wraps on the right"}];
/* An unset placement or width follows the document format; a set one is the
   figure's own. */
function figPlacement(f){ const d=docFormat().figures; return FIG_PLACEMENTS.some(x=>x.k===(f&&f.placement)) ? f.placement : (FIG_PLACEMENTS.some(x=>x.k===d.placement)?d.placement:"inline"); }
function figSpan(f){ const d=docFormat().figures; return FIG_SPANS.some(x=>x.k===(f&&f.span)) ? f.span : (FIG_SPANS.some(x=>x.k===d.span)?d.span:"double"); }
/* A caption is prose: samples, acronyms, citations and cross-references
   resolve in it exactly as they do in a paragraph. Acronyms stay short — a
   caption is not where a term is defined. */
function captionHTML(text){ return renderInline(text||"",{noExpand:true,firstAbbr:{}}); }
function composedCaption(f){
  const parts=f.panels.map((p,i)=>p.src?`<b>(${letters[i]})</b> ${captionHTML(p.cap||srcById(p.src)?.caption||"")}`:null).filter(Boolean);
  const n=figNumbers()[f.ref];
  return `<b>${esc(capLabel("fig",n,false))}${esc(capSep())}</b> ${captionHTML(f.leadIn)} ${parts.join("; ")}${parts.length?".":""}`;
}
function cellGeom(L){
  const nCols=L.cols.trim().split(/\s+/).length;
  const areaMode=L.areas[0].includes(" ");
  const nRows=areaMode? L.areas.length : L.rows.trim().split(/\s+/).length;
  const A=Math.min(3.2,Math.max(1.05,(nCols/nRows)*1.25));
  const spans=[];
  if(areaMode){
    const m=L.areas.map(r=>r.split(/\s+/));
    const names=[...new Set(m.flat())];
    names.forEach(n=>{
      let cs=0,rs=0;
      m.forEach(row=>{ const c=row.filter(x=>x===n).length; if(c){ rs++; cs=Math.max(cs,c); } });
      spans.push({cs,rs});
    });
  } else L.areas.forEach(()=>spans.push({cs:1,rs:1}));
  return {nCols,nRows,A,spans};
}
function figureHTML(f,o){
  o=o||{}; const L=layoutOf(f), G=cellGeom(L);
  const areaMode=L.areas[0].includes(" ");
  const grid = (areaMode
    ? `grid-template-columns:${L.cols};grid-template-rows:${L.rows};grid-template-areas:${L.areas.map(a=>`'${a}'`).join(" ")}`
    : `grid-template-columns:${L.cols};grid-template-rows:${L.rows}`) + `;aspect-ratio:${G.A.toFixed(3)}`;
  const cells=f.panels.map((p,i)=>{
    const area=areaMode?`grid-area:${letters[i]};`:"";
    const sp=G.spans[i]||{cs:1,rs:1};
    const asp=Math.max(.45,Math.min(4.2,((sp.cs/G.nCols)*G.A)/(sp.rs/G.nRows)));
    const src=p.src?srcById(p.src):null;
    const inner = !src ? `<span>empty</span>` :
      (src.dataURL? `<img src="${src.dataURL}" alt="${esc(src.name)}">` : renderChart(src,{w:Math.round(210*asp),h:210,thumb:true,print:!!o.print}));
    const ia=o.print?"":` role="button" tabindex="0" aria-label="Panel ${letters[i]}: ${esc(src?src.name:"empty")} — open in the composer"`;
    return `<div class="slot${src?"":" vacant"}" style="${area}" data-slot="${f.id}|${i}"${ia}><span class="letter" aria-hidden="true">${letters[i]}</span>${inner}</div>`;
  }).join("");
  const pl=figPlacement(f), sp=figSpan(f);
  const note = (!o.print && pl!=="inline")
    ? `<div class="figplace">${esc(FIG_PLACEMENTS.find(x=>x.k===pl).l)}</div>` : "";
  return `<figure class="fig-${sp} fig-${pl}" data-fig="${f.ref}" style="margin:0 0 14px"><div class="figframe"><div class="figgrid" style="${grid}">${cells}</div></div>
    ${note}<figcaption class="figcap">${composedCaption(f)}</figcaption></figure>`;
}
function miniLayout(k,f){
  const L = k==="custom" ? customLayout(f&&f.gridRows||[1,2]) : LAYOUTS[k];
  if(L.areas[0].includes(" ")) return `<div class="mini" style="grid-template-columns:${L.cols};grid-template-rows:${L.rows};grid-template-areas:${L.areas.map(a=>`'${a}'`).join(" ")}">${L.areas.join(" ").split(" ").filter((v,i,a)=>a.indexOf(v)===i).map(a=>`<i style="grid-area:${a}"></i>`).join("")}</div>`;
  return `<div class="mini" style="grid-template-columns:${L.cols};grid-template-rows:${L.rows}">${L.areas.map(()=>"<i></i>").join("")}</div>`;
}

/* ============================ PLOTS ============================ */
/* Wrap the selection in a field in ^{...} or _{...}. Works on any input
   that carries the `sym` class, which is every label and unit field. */
function wrapSelection(el, kind){
  if(!el) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
  const picked = el.value.slice(a, b) || (kind === "^" ? "2" : "2");
  el.value = el.value.slice(0, a) + kind + "{" + picked + "}" + el.value.slice(b);
  el.dispatchEvent(new Event("input", {bubbles: true}));
  el.focus();
  el.selectionStart = a + 2; el.selectionEnd = a + 2 + picked.length;
}
function supSubBar(){
  return `<button class="btn sm" data-wrap="^" type="button" title="Superscript the selection">x&sup2;</button>`
       + `<button class="btn sm" data-wrap="_" type="button" title="Subscript the selection">x&#8322;</button>`;
}

      ${grp("raw","Raw data",`${atts.length?atts.length+" file"+(atts.length>1?"s":""):"nothing attached"} · data/${esc(plotFolder(p))}/`,`

            : '<div class="empty">The numbers behind this plot — the spectra, the chromatograms, the spreadsheet. Filed into the deposition set and listed in the manifest.</div>'}`)}

}
function usedIn(id){
  const fs=S.figures.filter(f=>f.panels.some(p=>p.src===id));
  return fs.length? fs.map(f=>"Fig "+(S.figures.indexOf(f)+1)+letters[f.panels.findIndex(p=>p.src===id)]).join(", ") : "—";
}
</script>
<script>
"use strict";
/* ============================ VISUAL EQUATION EDITOR ============================
   b.latex stays the only stored form. This module parses that LaTeX into a small
   tree, draws the tree as editable boxes, and serialises straight back on every
   change. Anything the parser does not recognise becomes an opaque "raw" leaf
   that shows the LaTeX verbatim, so a round trip never loses characters.
   =============================================================================== */

/* --- one table, used both ways: command <-> glyph ------------------------- */
const SYM=[
  ["\\alpha","\u03B1"],["\\beta","\u03B2"],["\\gamma","\u03B3"],["\\delta","\u03B4"],
  ["\\epsilon","\u03F5"],["\\varepsilon","\u03B5"],["\\zeta","\u03B6"],["\\eta","\u03B7"],
  ["\\theta","\u03B8"],["\\vartheta","\u03D1"],["\\iota","\u03B9"],["\\kappa","\u03BA"],
  ["\\varkappa","\u03F0"],["\\lambda","\u03BB"],["\\mu","\u03BC"],["\\nu","\u03BD"],
  ["\\xi","\u03BE"],["\\pi","\u03C0"],["\\varpi","\u03D6"],["\\rho","\u03C1"],
  ["\\varrho","\u03F1"],["\\sigma","\u03C3"],["\\varsigma","\u03C2"],["\\tau","\u03C4"],
  ["\\upsilon","\u03C5"],["\\phi","\u03D5"],["\\varphi","\u03C6"],["\\chi","\u03C7"],
  ["\\psi","\u03C8"],["\\omega","\u03C9"],
  ["\\Gamma","\u0393"],["\\Delta","\u0394"],["\\Theta","\u0398"],["\\Lambda","\u039B"],
  ["\\Xi","\u039E"],["\\Pi","\u03A0"],["\\Sigma","\u03A3"],["\\Upsilon","\u03A5"],
  ["\\Phi","\u03A6"],["\\Psi","\u03A8"],["\\Omega","\u03A9"],
  ["\\infty","\u221E"],["\\times","\u00D7"],["\\cdot","\u22C5"],["\\pm","\u00B1"],
  ["\\mp","\u2213"],["\\div","\u00F7"],["\\leq","\u2264"],["\\geq","\u2265"],
  ["\\neq","\u2260"],["\\approx","\u2248"],["\\propto","\u221D"],["\\equiv","\u2261"],
  ["\\sim","\u223C"],["\\simeq","\u2243"],["\\ll","\u226A"],["\\gg","\u226B"],
  ["\\partial","\u2202"],["\\nabla","\u2207"],["\\hbar","\u210F"],["\\ell","\u2113"],
  ["\\ldots","\u2026"],["\\cdots","\u22EF"],["\\in","\u2208"],["\\notin","\u2209"],
  ["\\subset","\u2282"],["\\supset","\u2283"],["\\subseteq","\u2286"],["\\supseteq","\u2287"],
  ["\\cup","\u222A"],["\\cap","\u2229"],["\\forall","\u2200"],["\\exists","\u2203"],
  ["\\perp","\u22A5"],["\\parallel","\u2225"],["\\angle","\u2220"],["\\emptyset","\u2205"],
  ["\\rightarrow","\u2192"],["\\leftarrow","\u2190"],["\\leftrightarrow","\u2194"],
  ["\\Rightarrow","\u21D2"],["\\Leftarrow","\u21D0"],["\\Leftrightarrow","\u21D4"],
  ["\\uparrow","\u2191"],["\\downarrow","\u2193"],["\\rightleftharpoons","\u21CC"],
  ["\\mapsto","\u21A6"],["\\longrightarrow","\u27F6"],
  ["\\circ","\u2218"],["\\bullet","\u2022"],["\\ast","\u2217"],["\\star","\u22C6"],
  ["\\square","\u25A1"],["\\triangle","\u25B3"],["\\diamond","\u22C4"],
  ["\\dagger","\u2020"],["\\ddagger","\u2021"],["\\S","\u00A7"],["\\P","\u00B6"],
  ["\\langle","\u27E8"],["\\rangle","\u27E9"],["\\prime","\u2032"],
  ["\\aleph","\u2135"],["\\Re","\u211C"],["\\Im","\u2111"],["\\wp","\u2118"],
  ["\\surd","\u221A"],["\\neg","\u00AC"],["\\wedge","\u2227"],["\\vee","\u2228"],
  ["\\oplus","\u2295"],["\\otimes","\u2297"],["\\odot","\u2299"],["\\pmod","\u2AFD"]
];
/* Parse-only aliases: several commands normalise onto one glyph, which is fine
   because both spellings parse to the same tree. */
const SYM_ALIAS=[
  ["\\to","\u2192"],["\\gets","\u2190"],["\\degree","\u00B0"],["\\AA","\u00C5"],
  ["\\angstrom","\u00C5"],["\\dots","\u2026"],["\\lbrace","{"],["\\rbrace","}"],
  ["\\vert","|"],["\\micro","\u03BC"],["\\upmu","\u03BC"],["\\lt","<"],["\\gt",">"],
  ["\\{","{"],["\\}","}"],["\\_","_"],["\\&","&"],["\\#","#"],["\\%","%"],["\\$","$"],
  ["\\backslash","\\"],["\\^","^"],
  ["\\,","\u2009"],["\\;","\u2005"],["\\:","\u2004"],["\\quad","\u2003"],["\\qquad","\u2001"]
];
/* Glyphs that serialise to something other than a plain character. */
const SYM_ESC=[
  ["{","\\{"],["}","\\}"],["_","\\_"],["&","\\&"],["#","\\#"],["%","\\%"],["$","\\$"],
  ["\\","\\backslash"],["^","\\^{}"],
  ["\u2009","\\,"],["\u2005","\\;"],["\u2004","\\:"],["\u2003","\\quad"],["\u2001","\\qquad"]
];
const SYM_IN=new Map(), SYM_OUT=new Map();
SYM.forEach(p=>{ SYM_IN.set(p[0],p[1]); if(!SYM_OUT.has(p[1])) SYM_OUT.set(p[1],p[0]); });
SYM_ALIAS.forEach(p=>{ if(!SYM_IN.has(p[0])) SYM_IN.set(p[0],p[1]); });
SYM_ESC.forEach(p=>{ SYM_OUT.set(p[0],p[1]); });

const EQ_FRAC={frac:1,dfrac:1,tfrac:1,cfrac:1};
const EQ_BIGOP={sum:"\u2211",prod:"\u220F",coprod:"\u2210",int:"\u222B",iint:"\u222C",
  iiint:"\u222D",oint:"\u222E",lim:"lim",bigcup:"\u22C3",bigcap:"\u22C2",bigoplus:"\u2295"};
const EQ_ACCENT={hat:"\u02C6",bar:"\u00AF",vec:"\u2192",dot:"\u02D9",ddot:"\u00A8",
  tilde:"\u02DC",widehat:"\u02C6",widetilde:"\u02DC",check:"\u02C7",acute:"\u00B4",grave:"\u0060",
  overline:"over",underline:"under",overrightarrow:"\u2192"};
const EQ_FONT={mathrm:"rm",mathbf:"bf",mathit:"it",mathcal:"cal",mathbb:"bb",mathsf:"sf",
  mathtt:"tt",boldsymbol:"bf",text:"text",textrm:"text",textbf:"text",textit:"text",operatorname:"rm"};

/* ---------------------------------- parser ------------------------------- */
function eqIsSpace(c){ return c===" "||c==="\t"||c==="\n"||c==="\r"; }
function eqSkipWs(p){ while(p.i<p.s.length&&eqIsSpace(p.s[p.i])) p.i++; }
/* Reads one control sequence at p.i (which must be a backslash). */
function eqCmd(p){
  p.i++;
  const m=/^[A-Za-z]+/.exec(p.s.slice(p.i));
  if(m){ p.i+=m[0].length; eqSkipWs(p); return {name:m[0],word:true}; }
  const c=p.s[p.i]; p.i++;
  return {name:c===undefined?"":c,word:false};
}
function eqBalanced(p){ /* verbatim contents of a {...} at p.i */
  eqSkipWs(p);
  if(p.s[p.i]!=="{") return "";
  let d=0,out="",i=p.i;
  for(;i<p.s.length;i++){
    const c=p.s[i];
    if(c==="\\"){ out+=c+(p.s[i+1]||""); i++; continue; }
    if(c==="{"){ d++; if(d===1) continue; }
    if(c==="}"){ d--; if(d===0){ i++; break; } }
    out+=c;
  }
  p.i=i; return out;
}
function eqArg(p){ /* one argument: a braced group's children, or one atom */
  eqSkipWs(p);
  if(p.i>=p.s.length) return [];
  if(p.s[p.i]==="{"){ p.i++; const k=eqNodes(p); if(p.s[p.i]==="}") p.i++; return k; }
  const out=[]; eqOne(p,out); return eqTidy(out);
}
function eqOptArg(p){ /* [...] verbatim, or null */
  eqSkipWs(p);
  if(p.s[p.i]!=="[") return null;
  let d=0,out="",i=p.i;
  for(;i<p.s.length;i++){
    const c=p.s[i];
    if(c==="\\"){ out+=c+(p.s[i+1]||""); i++; continue; }
    if(c==="["){ d++; if(d===1) continue; }
    if(c==="]"){ d--; if(d===0){ i++; break; } }
    out+=c;
  }
  p.i=i; return eqParse(out);
}
function eqDelim(p){
  eqSkipWs(p);
  if(p.i>=p.s.length) return ".";
  if(p.s[p.i]==="\\"){ const c=eqCmd(p); return "\\"+c.name; }
  return p.s[p.i++];
}
/* The atom a following _ or ^ attaches to. */
function eqPopBase(out){
  if(!out.length) return [];
  const last=out[out.length-1];
  if(last.t==="text"&&!last.lit){
    if(!last.v.length){ out.pop(); return []; }
    const ch=last.v.slice(-1); last.v=last.v.slice(0,-1);
    if(!last.v.length) out.pop();
    return [{t:"text",v:ch}];
  }
  if(last.t==="group"&&!last.k.length){ out.pop(); return []; }
  out.pop(); return [last];
}
function eqReadScripts(p){
  let sub=null,sup=null;
  for(;;){
    const c=p.s[p.i];
    if(c==="_"&&sub===null){ p.i++; sub=eqArg(p); continue; }
    if(c==="^"&&sup===null){ p.i++; sup=eqArg(p); continue; }
    break;
  }
  return [sub,sup];
}
function eqOne(p,out){
  const c=p.s[p.i];
  if(c==="{"){ p.i++; const k=eqNodes(p); if(p.s[p.i]==="}") p.i++;
    if(k.length) out.push({t:"group",k:k}); /* an empty {} is a separator; drop it */
    return; }
  if(c==="_"||c==="^"){ const base=eqPopBase(out); const sc=eqReadScripts(p);
    out.push({t:"script",base:base,sub:sc[0],sup:sc[1]}); return; }
  if(c==="\\"){ eqCommand(p,out); return; }
  /* a run of ordinary characters */
  let j=p.i;
  while(j<p.s.length&&!/[\\{}^_]/.test(p.s[j])) j++;
  const run=p.s.slice(p.i,j); p.i=j;
  out.push({t:"text",v:run});
}
function eqCommand(p,out){
  const start=p.i;
  const cmd=eqCmd(p), n=cmd.name;
  if(!cmd.word){
    const g=SYM_IN.get("\\"+n);
    if(g!==undefined){ out.push({t:"text",v:g}); return; }
    out.push({t:"raw",v:p.s.slice(start,p.i)}); return;
  }
  if(n==="left"){
    const l=eqDelim(p), k=eqNodes(p,true);
    let r=".";
    if(p.s.startsWith("\\right",p.i)){ p.i+=6; r=eqDelim(p); }
    out.push({t:"brack",l:l,r:r,k:k}); return;
  }
  if(n==="right"){ const r=eqDelim(p); out.push({t:"raw",v:"\\right"+r}); return; }
  if(n==="ce"||n==="pu"){ const v=eqBalanced(p); out.push({t:"ce",cmd:n,v:v}); return; }
  if(n==="begin"){
    const name=eqBalanced(p);
    const close="\\end{"+name+"}", open="\\begin{"+name+"}";
    let d=1,i=p.i,body="";
    while(i<p.s.length){
      if(p.s.startsWith(open,i)){ d++; body+=open; i+=open.length; continue; }
      if(p.s.startsWith(close,i)){ d--; if(!d){ i+=close.length; break; } body+=close; i+=close.length; continue; }
      body+=p.s[i]; i++;
    }
    p.i=i; out.push({t:"env",name:name,v:body}); return;
  }
  if(n==="end"){ const name=eqBalanced(p); out.push({t:"raw",v:"\\end{"+name+"}"}); return; }
  if(EQ_FRAC[n]){ const a=eqArg(p), b=eqArg(p); out.push({t:"frac",cmd:n,n:a,d:b}); return; }
  if(n==="sqrt"){ const idx=eqOptArg(p), b=eqArg(p); out.push({t:"sqrt",idx:idx,b:b}); return; }
  if(EQ_BIGOP[n]){ const sc=eqReadScripts(p); out.push({t:"bigop",cmd:n,sub:sc[0],sup:sc[1]}); return; }
  if(EQ_ACCENT[n]){ out.push({t:"accent",cmd:n,b:eqArg(p)}); return; }
  if(EQ_FONT[n]){
    if(n==="text"||n==="textrm"||n==="textbf"||n==="textit"||n==="operatorname")
      return void out.push({t:"font",cmd:n,b:[{t:"text",v:eqBalanced(p),lit:true}]});
    out.push({t:"font",cmd:n,b:eqArg(p)}); return;
  }
  const g=SYM_IN.get("\\"+n);
  if(g!==undefined){ out.push({t:"text",v:g}); return; }
  out.push({t:"raw",v:"\\"+n});
}
/* Merge adjacent plain text runs so the tree has one leaf per run. */
function eqTidy(list){
  const out=[];
  for(const n of list){
    const prev=out[out.length-1];
    if(n.t==="text"&&!n.lit&&prev&&prev.t==="text"&&!prev.lit){ prev.v+=n.v; continue; }
    if(n.t==="text"&&!n.lit&&!n.v.length&&list.length>1) continue;
    out.push(n);
  }
  if(out.length===1&&out[0].t==="text"&&!out[0].lit&&!out[0].v.length) return [];
  return out;
}
function eqNodes(p,stopAtRight){
  const out=[];
  while(p.i<p.s.length){
    if(p.s[p.i]==="}") break;
    if(stopAtRight&&p.s.startsWith("\\right",p.i)) break;
    const before=p.i;
    eqOne(p,out);
    if(p.i===before) p.i++; /* never loop */
  }
  return eqTidy(out);
}
function eqParse(src){ const p={s:String(src==null?"":src),i:0}; return eqNodes(p,false); }

/* -------------------------------- serialiser ------------------------------ */
function eqSerText(v){
  let out="";
  for(let i=0;i<v.length;i++){
    const ch=v[i]==="\u00a0"?" ":v[i];
    const cmd=SYM_OUT.get(ch);
    if(cmd===undefined){ out+=ch; continue; }
    out+=cmd;
    if(/^\\[A-Za-z]+$/.test(cmd)){
      const nx=v[i+1];
      if(nx!==undefined&&/[A-Za-z \u00a0]/.test(nx)) out+="{}";
    }
  }
  return out;
}
function eqWrapArg(k){ return "{"+eqSer(k)+"}"; }
/* A base needs braces unless it is a single self-delimiting atom. */
function eqSerBase(k){
  if(!k||!k.length) return "{}";
  if(k.length===1){
    const n=k[0];
    if(n.t==="text"&&!n.lit){ const s=eqSerText(n.v); if(s.length===1||/^\\[A-Za-z]+$/.test(s)) return s; }
    if(n.t!=="text"&&n.t!=="raw"&&n.t!=="script") return eqSerNode(n);
  }
  return "{"+eqSer(k)+"}";
}
function eqSerNode(n){
  switch(n.t){
    case "text": return n.lit?n.v:eqSerText(n.v);
    case "raw": return n.v;
    case "group": return "{"+eqSer(n.k)+"}";

/* ------------------------------- self test -------------------------------- */

   character is ever lost by opening an equation in the visual editor. Run it

const EQ_TESTS=[
  "\\theta_{\\mathrm{Ti}} = \\frac{I_{\\mathrm{Ti}\\,2p}/S_{\\mathrm{Ti}\\,2p}}{I_{\\mathrm{Ti}\\,2p}/S_{\\mathrm{Ti}\\,2p} + I_{\\mathrm{Si}\\,2p}/S_{\\mathrm{Si}\\,2p}}",
  "E = h\\nu",
  "x^{2}+y^{2}=z^{2}",
  "\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}",
  "\\int_{0}^{\\infty} e^{-x}\\,dx = 1",
  "\\sqrt[3]{x+1}",
  "\\hat{H}\\psi = E\\psi",
  "\\vec{F} = m\\vec{a}",
  "\\ce{TiO2 + H2O -> Ti(OH)4}",
  "\\ce{Fe^{3+} + 3OH^- -> Fe(OH)3 v}",
  "\\left(\\frac{a}{b}\\right)^{n}",
  "\\left[ x \\right] \\left\\{ y \\right\\}",
  "\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}",
  "\\begin{aligned}a &= b\\\\ &= c\\end{aligned}",
  "\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1",
  "\\alpha\\beta\\gamma \\Delta \\Omega",
  "\\bar{x} \\pm \\sigma / \\sqrt{n}",
  "k_{\\mathrm{B}}T \\approx 25\\,\\mathrm{meV}",
  "\\text{binding energy} = h\\nu - E_{\\mathrm{k}} - \\phi",
  "\\frac{\\partial y}{\\partial x} \\geq 0",
  "\\overline{AB} \\perp \\underline{CD}",
  "A \\xrightarrow{cat} B",
  "2 \\times 10^{-3}\\ \\mathrm{mbar}",

function eqSelfTest(verbose){
  const fails=[];

    const t1=eqParse(src), a=eqSer(t1), t2=eqParse(a), b=eqSer(t2);
    const same=JSON.stringify(t1)===JSON.stringify(t2)&&a===b;

function eqGreekItems(){
  const out=[];
  EQ_GREEK_NAMES.forEach(n=>{ const g=SYM_IN.get("\\"+n); out.push([g,"\\"+n,n]); });
  EQ_GREEK_CAPS.forEach((c,i)=>{
    const tex=c[1], g=tex.charAt(0)==="\\"?SYM_IN.get(tex):tex;
    out.push([g||tex,tex,EQ_CAP_LABEL[i]+(tex.charAt(0)==="\\"?"":" (upright capital)")]);
  });
  return out;
}

/* Symbols… — a tabbed dialog that stays open so several symbols can go in. */
function eqvSymbolsModal(bid){
  const tabs=[["sci","Science",EQ_TAB_SCI],["greek","Greek",eqGreekItems()],["shapes","Shapes & arrows",EQ_TAB_SHAPES]];
  modal("Symbols",
    '<div class="eqv-tabs" role="tablist">'+tabs.map((t,i)=>
      '<button type="button" class="eqv-tab" role="tab" data-eqtab="'+t[0]+'" aria-selected="'+(i===0?"true":"false")+'">'+esc(t[1])+'</button>').join("")+'</div>'+
    tabs.map((t,i)=>'<div class="eqv-pane" data-eqpane="'+t[0]+'"'+(i?" hidden":"")+'>'+eqvGrid(bid,t[2])+'</div>').join("")+
    '<div class="note" style="margin-top:10px">Each symbol goes in at the caret in the equation behind this dialog, which stays open until you close it.</div>',
    '<button class="btn p" data-close>Close</button>');
}
function eqvTabTo(btn){
  const m=btn.closest(".modal"); if(!m) return;
  $$("[data-eqtab]",m).forEach(b=>b.setAttribute("aria-selected",b===btn?"true":"false"));
  $$("[data-eqpane]",m).forEach(p=>{ p.hidden=p.dataset.eqpane!==btn.dataset.eqtab; });
}
function eqvClosePop(){ if(eqvPopEl&&eqvPopEl.parentNode) eqvPopEl.parentNode.removeChild(eqvPopEl); eqvPopEl=null; }
function eqvPopover(btn,title,html){
  const open=eqvPopEl&&eqvPopEl.__from===btn;
  eqvClosePop();
  if(open) return;
  const bar=btn.closest(".eqv-bar"); if(!bar) return;
  const p=document.createElement("div");
  p.className="eqv-pop";
  p.innerHTML='<div class="eqv-poph"><b>'+esc(title)+'</b><button type="button" class="btn sm" data-eqpopx="1">Close</button></div>'+html;
  p.__from=btn;
  bar.appendChild(p);
  p.style.left=Math.max(0,Math.min(btn.offsetLeft,Math.max(0,bar.clientWidth-p.offsetWidth)))+"px";
  p.style.top=(btn.offsetTop+btn.offsetHeight+5)+"px";
  eqvPopEl=p;
}
function eqvMenu(btn){
  const parts=String(btn.dataset.eqmenu||"").split("|"), kind=parts[0], bid=parts[1];
  if(kind==="sym"){ eqvClosePop(); eqvSymbolsModal(bid); return; }
  if(kind==="ops") return eqvPopover(btn,"Operators",eqvActGrid(bid,EQ_OPS));
  if(kind==="fmt") return eqvPopover(btn,"Formatting",eqvActGrid(bid,EQ_FMT));
  if(kind==="chem") return eqvPopover(btn,"Chemistry",eqvListGrid(bid,EQ_CHEM)+
    '<div class="note" style="margin-top:8px">Everything inside <code>\\ce{ }</code> is written in mhchem notation \u2014 <code>-&gt;</code> for an arrow, <code>&lt;=&gt;</code> for equilibrium, <code>^</code> and <code>_</code> for charges and counts, <code>v</code> and <code>^</code> after a species for a precipitate or an evolved gas.</div>');
}
/* Visual | LaTeX. Session only: the choice is never written to the document. */
function eqvMode(btn){
  const parts=String(btn.dataset.eqmode||"").split("|"), want=parts[0], bid=parts[1];
  const host=eqvHost(bid); if(!host) return;
  const wrapEl=host.closest(".bd"); if(!wrapEl) return;
  const fld=wrapEl.querySelector(".eqv-texfld");
  const tex=want==="t";
  if(!ui.eqLatex) ui.eqLatex=new Set();
  if(tex) ui.eqLatex.add(bid); else ui.eqLatex.delete(bid);
  host.hidden=tex; if(fld) fld.hidden=!tex;
  $$("[data-eqmode]",wrapEl).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.eqmode.split("|")[0]===want)));
  const b=eqvBlock(bid);
  const ta=wrapEl.querySelector('[data-eqtex$="|'+bid+'"]');
  if(tex){ if(ta&&b){ ta.value=b.latex||""; ta.focus(); } eqvClosePop(); }
  else if(b){ host.__tree=eqParse(b.latex||""); eqvPaint(host); }
}
function eqToolbarHTML(sec,b){
  const tex=!!(ui.eqLatex&&ui.eqLatex.has(b.id));
  const mb=(k,l)=>'<button type="button" class="btn sm" data-eqmenu="'+k+"|"+esc(b.id)+'">'+esc(l)+'</button>';
  return '<div class="eqv-bar">'+
    mb("sym","Symbols\u2026")+mb("ops","Operators")+mb("fmt","Formatting")+mb("chem","Chemistry")+
    '<span class="seg" style="margin-left:auto"><button type="button" data-eqmode="v|'+esc(b.id)+'" aria-pressed="'+(!tex)+'">Visual</button>'+
    '<button type="button" data-eqmode="t|'+esc(b.id)+'" aria-pressed="'+tex+'">LaTeX</button></span></div>'+
    '<div class="eqv-host" data-eqv="'+esc(sec.id)+"|"+esc(b.id)+'"'+(tex?" hidden":"")+
    ' role="group" aria-label="Equation, visual editor"></div>';
}

/* ------------------------- delegated toolbar events ------------------------ */
/* mousedown is cancelled so the caret stays where the user left it. */
document.addEventListener("mousedown",e=>{
  const t=e.target; if(!t||!t.closest) return;
  if(t.closest("[data-eqsym],[data-eqwrap],[data-eqmenu],[data-eqmode],[data-eqtab],[data-eqpopx]")) e.preventDefault();
  if(eqvPopEl&&!t.closest(".eqv-pop")&&!t.closest("[data-eqmenu]")) eqvClosePop();
},true);
document.addEventListener("click",e=>{
  const t=e.target; if(!t||!t.closest) return;
  let el;
  if((el=t.closest("[data-eqsym]"))){ e.preventDefault(); eqvInsertLatex(el.dataset.eqbid,el.dataset.eqsym); return; }
  if((el=t.closest("[data-eqwrap]"))){ e.preventDefault(); eqvWrap(el.dataset.eqbid,el.dataset.eqwrap); return; }
  if((el=t.closest("[data-eqmenu]"))){ e.preventDefault(); eqvMenu(el); return; }
  if((el=t.closest("[data-eqmode]"))){ e.preventDefault(); eqvMode(el); return; }
  if((el=t.closest("[data-eqtab]"))){ e.preventDefault(); eqvTabTo(el); return; }
  if(t.closest("[data-eqpopx]")){ e.preventDefault(); eqvClosePop(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&eqvPopEl) eqvClosePop(); },true);

/* The textarea keeps its caret while the dialog is open: every button cancels
   its mousedown, and the selection is remembered across the inserts. */
let psymTA=null, psymSel={start:0,end:0};
function psymRemember(ta){
  if(!ta) return;
  psymTA=ta;
  const v=ta.value||"";
  psymSel={start:ta.selectionStart==null?v.length:ta.selectionStart, end:ta.selectionEnd==null?v.length:ta.selectionEnd};
}
function psymInsert(text,accent){
  const ta=psymTA; if(!ta||!document.contains(ta)) return;
  const v=ta.value||"";
  let a=Math.max(0,Math.min(psymSel.start,v.length)), b=Math.max(a,Math.min(psymSel.end,v.length));
  let ins=String(text==null?"":text);
  if(accent){ a=b; if(a===0) ins="◌"+ins; }
  ta.value=v.slice(0,a)+ins+v.slice(b);
  const at=a+ins.length;
  psymSel={start:at,end:at};

const INS_ITEMS=[["fig","Figure…"],["tbl","Table…"],["eq","Equation"],["gantt","Gantt chart"]];
let insAt=null;
function closeInsMenu(){
  const m=$(".insmenu"); if(!m) return;
  if(m.__from) m.__from.setAttribute("aria-expanded","false");
  if(m.parentNode) m.parentNode.removeChild(m);
}
function insReadCaret(sid,bid){
  const ta=document.querySelector('[data-block="'+sid+'|'+bid+'"]');
  if(!ta) return null;
  return ta.selectionStart==null?(ta.value||"").length:ta.selectionStart;
}
function openInsMenu(btn){
  const cur=$(".insmenu"), same=cur&&cur.__from===btn;
  closeInsMenu();
  if(same) return;
  const parts=String(btn.dataset.insmenu||"").split("|"), sid=parts[0], bid=parts[1];
  const bar=btn.closest(".blkbar"); if(!bar) return;
  const pos=insReadCaret(sid,bid);
  insAt={sid:sid,bid:bid,pos:pos==null?0:pos};
  const m=document.createElement("div");
  m.className="insmenu"; m.setAttribute("role","menu"); m.setAttribute("aria-label","Insert at the caret");
  m.innerHTML='<div class="ttl">Insert at the caret</div>'+INS_ITEMS.map(it=>
    '<button type="button" role="menuitem" data-insdo="'+esc(sid)+"|"+esc(bid)+"|"+it[0]+'">'+esc(it[1])+'</button>').join("");
  m.__from=btn;
  bar.appendChild(m);
  m.style.left=Math.max(0,Math.min(btn.offsetLeft,Math.max(0,bar.clientWidth-m.offsetWidth)))+"px";
  m.style.top=(btn.offsetTop+btn.offsetHeight+4)+"px";
  btn.setAttribute("aria-expanded","true");
}
/* The text before the caret stays where it is, what follows becomes a new
   paragraph, and the block goes in between. At either end there is no split. */
function insSplit(sid,bid,blocks){
  const sec=S.subdocs[sub].sections.find(s=>s.id===sid); if(!sec) return false;
  const i=(sec.blocks||[]).findIndex(x=>x.id===bid); if(i<0) return false;
  const b=sec.blocks[i], text=String(b.text||"");
  let pos=(insAt&&insAt.sid===sid&&insAt.bid===bid)?insAt.pos:text.length;
  const live=insReadCaret(sid,bid);
  const ta=document.querySelector('[data-block="'+sid+'|'+bid+'"]');
  if(live!=null&&ta&&document.activeElement===ta) pos=live;
  pos=Math.max(0,Math.min(pos,text.length));
  const before=text.slice(0,pos), after=text.slice(pos);
  if(!after) sec.blocks.splice(i+1,0,...blocks);
  else if(!before) sec.blocks.splice(i,0,...blocks);
  else {
    b.text=before; stampBlock(b);
    const tail=newBlock("p"); tail.text=after; stampBlock(tail);
    sec.blocks.splice(i+1,0,...blocks.concat([tail]));
  }
  insAt=null;
  return true;
}
function focusEqLeaf(bid){
  requestAnimationFrame(()=>{
    const host=eqvHost(bid);
    if(!host){ focusBlock(bid); return; }
    const ls=eqvLeaves(host);
    if(ls.length) eqvCaret(ls[0],ls[0].textContent.length); else focusBlock(bid);
  });
}
function insDo(sid,bid,kind){
  closeInsMenu();

}

function insPlace(kind,sid,bid,ref){
  let msg;

    if(kind==="fig"){
      ref="F"+(S.figures.length+1);

/* ============================ PAGINATION ============================
   The preview and the PDF are real pages. The document is rendered once as a
   flow of blocks, then dealt onto sheets of the format's size: a block that
   does not fit is split where it can be (a paragraph by words, a list or the
   bibliography by items, a table by rows) and the rest goes to the next
   sheet. Figures placed top or bottom of the page are dealt to that edge;
   half-width figures float and the text wraps. Two-column formats use CSS
   columns inside the sheet, so a column break is the browser's, and the sheet
   break is ours. Measurement happens in #pgHost, off-screen but laid out. */
let pvPageCount=0;
const PG_MIN_WORDS=4;
function htmlTokens(html){
  const toks=[]; const re=/<svg[\s\S]*?<\/svg>|<[^>]+>|[^<\s]+|\s+/g; let m;
  while((m=re.exec(html))) toks.push(m[0]);

}
function htmlWords(html){ return htmlTokens(html).filter(t=>!(t[0]==="<"&&!t.startsWith("<svg"))&&!/^\s+$/.test(t)).length; }
/* Split inline HTML after `k` words, closing and reopening the tags that
   straddle the cut, so both halves are well-formed. */
function splitHTML(html,k){
  const toks=htmlTokens(html), open=[]; let head="", n=0, i=0;

      else if(!t.endsWith("/>") && !/^<(br|img|hr|input|wbr)\b/i.test(t)) open.push({name:(t.match(/^<([a-zA-Z0-9]+)/)||[])[1],tag:t});

function pgMakePage(F,G,PG,vars,pageNo){

  const foot=document.createElement("div"); foot.className="pgfoot";
  const body=document.createElement("div"); body.className="pgbody";

/* Header and footer bands for one page, written after the count is known. */
function pgBands(page,PG,pageNo,total){

  page.querySelector(".pghead").innerHTML=h; page.querySelector(".pgfoot").innerHTML=f;

function pgLayoutBody(page,F,G){
  const mm=96/25.4, headH=page.querySelector(".pghead").offsetHeight/mm, footH=page.querySelector(".pgfoot").offsetHeight/mm;
  const top=Math.max(G.m.top, (F.page.headerGap||8)+headH+(headH?3:0));
  const bottom=Math.max(G.m.bottom, (F.page.footerGap||8)+footH+(footH?3:0));

/* "spill": content has left the type area (past the last column, or below

   nothing about. A collision in a page with another column is fixed by a
   column break; a spill needs a new page. */
function pgSpills(body, art, reserved){
  if(body.scrollHeight>body.clientHeight+1 || body.scrollWidth>body.clientWidth+1) return true;
  const br=body.getBoundingClientRect();
  for(const c of art.children){ if(c===reserved) continue;
    for(const r of c.getClientRects()) if(r.bottom>br.bottom+1 || r.right>br.right+1) return true; }

function pgKind(el){

  if(el.matches&&el.matches("p")) return "p";

/* Try to split `el` so the head fits. `fits(candidate)` places and measures.

function pgSplit(el, kind, fits){
  if(kind==="p"){
    const html=el.innerHTML, total=htmlWords(html);
    if(total<2*PG_MIN_WORDS) return null;
    let lo=PG_MIN_WORDS, hi=total-PG_MIN_WORDS, best=0;
    while(lo<=hi){ const mid=(lo+hi)>>1, c=el.cloneNode(false); c.innerHTML=splitHTML(html,mid)[0];

    while(lo<=hi){ const mid=(lo+hi)>>1; if(fits(make(mid))){ best=mid; lo=mid+1; } else hi=mid-1; }

}

  sub=which||sub;

  host.innerHTML="";

    carryBottom.splice(0).forEach(el=>{ art.append(el); bottoms.push(el); });
  };
  const insert=el=>{ if(bottoms.length) art.insertBefore(el,bottoms[0]); else art.append(el); };
  const overflows=()=>pgOverflows(body,art,reserved);
  const contentCount=()=>[...art.children].filter(c=>!bottoms.includes(c)&&c!==reserved).length;
  fresh();
  let guard=0;
  while(queue.length && guard++<5000){
    const el=queue.shift(), kind=pgKind(el);
    if(kind==="affnotes"){ // foot of the first column of this page, reserved
      art.append(el); reserved=el;
      if(overflows()){ el.remove(); reserved=null; carryBottom.push(el); }
      continue;
    }
    if(kind==="top"){
      /* Top of the page means the top of the text column: after the front
         matter (title, byline, abstract), which spans the columns. */
      const first=[...art.children].find(c=>c!==reserved && !bottoms.includes(c) && !c.matches("h1,.authorline,.afflist,.abstract,.keywords,.objbox"));
      if(first) art.insertBefore(el,first); else insert(el);
      if(overflows()){ el.remove(); if(contentCount()===0){ art.append(el); } else carryTop.push(el); }
      continue;
    }
    if(kind==="bottom"){
      art.append(el); bottoms.push(el);
      if(overflows()){ el.remove(); bottoms.pop(); if(contentCount()===0&&!bottoms.length){ art.append(el); bottoms.push(el); } else carryBottom.push(el); }
      continue;
    }
    insert(el);
    if(!overflows()) continue;
    const fits=c=>{ insert(c); const ok=!overflows(); c.remove(); return ok; };
    if(!pgSpills(body,art,reserved) && (F.columns||1)>1){
      /* It only collides with the reserved box: what fits stays above it and
         the rest starts the next column. */
      el.remove();
      const parts=pgSplit(el,kind,fits);
      if(parts){ insert(parts[0]); parts[1].classList.add("colbreak"); queue.unshift(parts[1]); continue; }
      el.classList.add("colbreak"); insert(el);
      if(!overflows()) continue;
      el.classList.remove("colbreak");
    }
    el.remove();
    const parts=pgSplit(el,kind,fits);
    if(parts){ insert(parts[0]); queue.unshift(parts[1]); fresh(); continue; }
    if(contentCount()===0){ insert(el); fresh(); continue; }   // nothing else on the page: it stays, oversize
    queue.unshift(el); fresh();
  }
  /* Leftover carried figures get pages of their own. */
  while(carryTop.length||carryBottom.length){ fresh(); if(guard++>5200) break; }
  pages.forEach((p,i)=>pgBands(p,PG,i+1,pages.length));
  pages.forEach(p=>p.remove());
  sub=keep;
  return {pages,F,G};
}

/* ---- minimal ZIP writer (stored entries) — no external library ---- */
const CRCT=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRCT[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipBlob(files){
  // files: [{name, data: Uint8Array}]
  const enc=new TextEncoder(), locals=[], central=[]; let offset=0;
  const w32=(a,i,v)=>{ a[i]=v&255; a[i+1]=(v>>>8)&255; a[i+2]=(v>>>16)&255; a[i+3]=(v>>>24)&255; };
  const w16=(a,i,v)=>{ a[i]=v&255; a[i+1]=(v>>>8)&255; };
  files.forEach(f=>{
    const nameB=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+nameB.length);
    w32(lh,0,0x04034b50); w16(lh,4,20); w16(lh,6,0); w16(lh,8,0); w16(lh,10,0); w16(lh,12,0);
    w32(lh,14,crc); w32(lh,18,data.length); w32(lh,22,data.length);
    w16(lh,26,nameB.length); w16(lh,28,0); lh.set(nameB,30);
    locals.push(lh,data);
    const ch=new Uint8Array(46+nameB.length);
    w32(ch,0,0x02014b50); w16(ch,4,20); w16(ch,6,20); w16(ch,8,0); w16(ch,10,0); w16(ch,12,0); w16(ch,14,0);
    w32(ch,16,crc); w32(ch,20,data.length); w32(ch,24,data.length);
    w16(ch,28,nameB.length); w16(ch,30,0); w16(ch,32,0); w16(ch,34,0); w16(ch,36,0); w32(ch,38,0);
    w32(ch,42,offset); ch.set(nameB,46);
    central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize=central.reduce((n,c)=>n+c.length,0);
  const eocd=new Uint8Array(22);
  w32(eocd,0,0x06054b50); w16(eocd,4,0); w16(eocd,6,0);
  w16(eocd,8,files.length); w16(eocd,10,files.length);
  w32(eocd,12,cdSize); w32(eocd,16,offset); w16(eocd,20,0);
  return new Blob(locals.concat(central,[eocd]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

function xesc(t){ return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function runsFromHTML(html){
  // tiny subset: <i> <b> <u> <sup> <sub> and text
  const out=[]; let i=0, it=false, bo=false, su=false, sb=false, un=false, buf="";
  const flush=()=>{ if(!buf) return;
    out.push({t:buf.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&nbsp;/g," "),i:it,b:bo,s:su,sb:sb,u:un}); buf=""; };
  html.replace(/<[^>]+>|[^<]+/g,tok=>{
    if(tok[0]!=="<"){ buf+=tok; return tok; }
    const t=tok.toLowerCase();
    if(/^<(i|em)[ >]/.test(t)||t==="<i>"||t==="<em>"){flush();it=true;}
    else if(t==="</i>"||t==="</em>"){flush();it=false;}
    else if(t==="<b>"||t==="<strong>"){flush();bo=true;}
    else if(t==="</b>"||t==="</strong>"){flush();bo=false;}
    else if(t==="<sup>"){flush();su=true;}
    else if(t==="</sup>"){flush();su=false;}
    else if(t==="<sub>"){flush();sb=true;}
    else if(t==="</sub>"){flush();sb=false;}
    else if(t==="<u>"){flush();un=true;}
    else if(t==="</u>"){flush();un=false;}
    else if(t==="<br>"||t==="<br/>"){flush();out.push({br:true});}
    else flush();
    return tok;
  });
  flush(); return out;
}
