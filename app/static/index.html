  const media=[]; // {name,b64,cx,cy}
  /* Geometry from the format: the text width in EMU, and a column's. */
  const F=docFormat(), G=pageGeom(F), tw=mm=>Math.round(mm*56.6929), twips=n=>String(Math.round(n));
  const textMM=G.w-G.m.left-G.m.right, colMM=(F.columns||1)>1 ? (textMM-((F.columns||1)-1)*(F.columnGap||6))/(F.columns||1) : textMM;
  const maxW=Math.round(textMM*36000), colW=Math.round(colMM*36000);
  const JC=({justify:"both",center:"center",right:"right",left:"left"})[F.align||(F.justify?"justify":"left")]||"both";
  const jcOf=b=>({justify:"both",center:"center",right:"right",left:"left"})[b.align]||JC;
  async function pushChart(svg,w,h){
    const scale=2, px=Math.min(1400,Math.round(w*scale)), py=Math.round(h*scale);
    let b64=null; try{ b64=await svgToPngB64(svg,px,py); }catch(e){ return null; }
    const cx=maxW, cy=Math.round(maxW*(py/px));
    media.push({name:`image${media.length+1}.png`,b64,cx,cy}); return media.length;
  }
  const parts=[];
  parts.push(wP(runsFromHTML(fmtInline(esc(S.title))),"Title"));
  parts.push(wP(runsFromHTML(al.names),"Authors"));
  const affRuns = al.affs ? runsFromHTML(al.affs.replace(/<br>/g,"\n").replace(/\n/g,"<br>")) : null;
  /* Footnote addresses follow the abstract, ruled off, because a real Word
     footnote part is not written here yet — HANDOFF section 6. */
  if(affRuns && al.place!=="footnote") parts.push(wP(affRuns,"Affil"));
  if(sub==="manuscript"&&S.abstract){ parts.push(wP((F.fonts.abstract.label?[{t:"Abstract. ",b:true}]:[]).concat(runsFromHTML(fmtInline(esc(S.abstract)))),"Abstract")); }
  if(sub==="manuscript"&&(S.keywords||[]).length) parts.push(wP([{t:"Keywords: ",b:true},{t:S.keywords.join(", ")}],"Abstract"));
  if(affRuns && al.place==="footnote") parts.push(wP(affRuns,"Affil",'<w:pBdr><w:top w:val="single" w:sz="4" w:color="000000"/></w:pBdr>'));
  const frontEnd=parts.length; // everything before this spans the columns
  const PJ=S.project||{};
  if(sub==="manuscript"&&PJ.showObjectives&&(PJ.objectives||[]).length){
    const shd='<w:shd w:val="clear" w:color="auto" w:fill="EEF2FF"/><w:pBdr><w:left w:val="single" w:sz="18" w:color="'+(F.colours.accent||"#000").replace("#","")+'"/></w:pBdr>';
    parts.push(wP([{t:PJ.objectivesTitle||"Aims and objectives",b:true}],"Normal",shd+'<w:spacing w:after="60"/>'));
    if(PJ.aim) parts.push(wP(runsFromHTML(captionHTML(PJ.aim)),"Normal",shd));
    PJ.objectives.forEach(o=>parts.push(wP([{t:o.code+" ",b:true}].concat(runsFromHTML(captionHTML(o.text))),"Normal",shd+'<w:ind w:left="284"/>')));
  }
  const secNums=sectionNumbers();
  for(const sec of orderedSections()){
    const lv=secLevel(sec), num=secNums[sec.id]?secNums[sec.id]+" ":"";
    /* A C heading is not a paragraph of its own: it runs into the first one. */
    let runIn = lv>=3 ? num+sec.title : null;
    if(lv===1) parts.push(wP(runsFromHTML(esc(num)+fmtInline(esc(sec.title))),"Heading2"));
    else if(lv===2) parts.push(wP(runsFromHTML(esc(num)+fmtInline(esc(sec.title))),"Heading3"));
    for(const b of (sec.blocks||[])){
      if(b.type==="p"||b.type==="gen"){
        for(const part of bodyParts(b.text||"")){
          const line=t=>runsFromHTML(renderInline(t).replace(/<span class="inlinemath">.*?<\/span>/g,"[math]"));
          if(part.kind==="p"){
            let rs=line(part.text);
            if(runIn){ rs=[{t:runIn+" ",b:true,i:true}].concat(rs); runIn=null; }
            parts.push(wP(rs,"Normal",`<w:jc w:val="${jcOf(b)}"/>`)); continue; }
          /* Real Word lists, so the numbering is Word's and renumbers on edit. */
          const numId = part.kind==="ul" ? 1 : 2;
          part.items.forEach(t=>parts.push(wP(line(t),"ListParagraph",
            `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${numId}"/></w:numPr>`)));
        }
      }
      else if(b.type==="eq"){
        if(runIn){ parts.push(wP([{t:runIn,b:true,i:true}],"Normal")); runIn=null; }
        const svg=mathSVG(b.latex||"",true);
        if(/^<svg/.test(svg)){ const vb=(svg.match(/viewBox="([^"]+)"/)||[])[1];
          const [,,vw,vh]=(vb||"0 0 400 100").split(/\s+/).map(Number);
          const idx=await pushChart(svg,Math.min(400,vw/3),Math.max(30,vh/3));
          if(idx){ const m=media[idx-1]; m.cx=Math.min(maxW,Math.round(m.cx*0.55)); m.cy=Math.round(m.cy*0.55); parts.push(wImg("rId"+(100+idx),m.cx,m.cy,100+idx)); } }
        else parts.push(wP([{t:b.latex||"",i:true}],"Normal"));
        if(b.numbered!==false&&b._n) parts.push(wP([{t:"("+b._n+")"}],"Normal",'<w:jc w:val="right"/>'));
      }
      else if(b.type==="tbl"){
        const t=S.tables.find(x=>x.ref===b.tblRef); if(!t) continue;
        parts.push(wP([{t:capLabel("tbl",tblNumbers()[t.ref],false)+capSep()+" ",b:true}].concat(runsFromHTML(captionHTML(t.caption))),"Caption"));
        parts.push(wTable(tableCells(t)));
      }
      else if(b.type==="gantt"){
        if(runIn){ parts.push(wP([{t:runIn,b:true,i:true}],"Normal")); runIn=null; }
        const svg=ganttSVG({print:true}), vb=(svg.match(/viewBox="([^"]+)"/)||[])[1], [,,vw,vh]=(vb||"0 0 800 300").split(/\s+/).map(Number);
        const idx=await pushChart(svg,vw,vh);
        if(idx){ const m=media[idx-1]; parts.push(wImg("rId"+(100+idx),m.cx,m.cy,100+idx)); }
        parts.push(wP([{t:capLabel("fig",figNumbers()[b.id],false)+capSep()+" ",b:true}].concat(runsFromHTML(captionHTML(b.caption||""))),"Caption"));
      }
      else if(b.type==="fig"){
        const f=S.figures.find(x=>x.ref===b.figRef); if(!f) continue;
        if(runIn){ parts.push(wP([{t:runIn,b:true,i:true}],"Normal")); runIn=null; }
        /* A single-column figure is set at 48% of the text width, which is what
           8.3 cm is against the 17.1 cm RSC and ACS both use for a full width. */
        const sp=figSpan(f);
        const wide = sp==="double" ? maxW : (F.columns||1)>1 ? colW : Math.round(maxW*0.48);
        const scale = wide/maxW;
        const fig=[];
        // one image per panel, stacked (Word has no easy grid without tables)
        for(let i=0;i<f.panels.length;i++){
          const pn=f.panels[i], src=pn.src?srcById(pn.src):null; if(!src) continue;
          if(src.dataURL){ media.push({name:`image${media.length+1}.png`,b64:src.dataURL.split(",")[1],cx:wide,cy:Math.round(wide*0.62)});
            fig.push(wImg("rId"+(100+media.length),wide,Math.round(wide*0.62),100+media.length)); continue; }
          const idx=await pushChart(renderChart(src,{w:560,h:360,print:true}),560,360);
          if(idx){ const m=media[idx-1]; const cy=Math.round(m.cy*scale);
            fig.push(wImg("rId"+(100+idx),wide,cy,100+idx)); }
        }
        fig.push(wP(runsFromHTML(composedCaption(f)),"Caption"));
        const pl=figPlacement(f);
        if(pl==="inline" && /^wrap/.test(sp)) parts.push(wWrapBlock(fig.join(""), sp==="wrapleft"?"left":"right", Math.round(maxW*0.5)));
        else if(pl==="inline") parts.push(fig.join(""));
        else parts.push(wFloatBlock(fig.join(""), pl, sp==="double"?null:Math.round(wide/635)));
      }
    }
  }
  if(bib.length){ parts.push(wP([{t:"References"}],"Heading2"));
    bib.forEach(x=>parts.push(wP([{t:"["+x.n+"] "}].concat(runsFromHTML(Sp.bib(x.ref))),"Biblio"))); }
  if(S.funding){ parts.push(wP([{t:"Funding"}],"Heading2")); parts.push(wP([{t:S.funding}],"Normal")); }

  /* Header and footer come from the template in use; a document with no
     template gets neither, and the section properties say nothing about them. */
  const PG=pageSetup(templateById(S.templateId));
  const hf=[]; // {part, xml, rels, media:[{name,b64}]}
  const LOGO_H=324000; // 9 mm, the usual height for a letterhead mark
  for(const where of ["header","footer"]){
    const band=PG[where];
    const used = band.left||band.centre||band.right||band.logo ||
      (PG.pageNumbers && (PG.numberIn||"footer-centre").split("-")[0]===where);
    if(!used) continue;
    let rid=null, cx=0, cy=LOGO_H, logoMedia=null;
    if(band.logo && /^data:image\//.test(band.logo)){
      const a=await imgAspect(band.logo);
      if(a){ rid="rIdLogo"; cx=Math.round(LOGO_H*a);
        logoMedia={name:`logo-${where}.png`, b64:band.logo.split(",")[1]}; }
    }
    hf.push({where, xml:wHeaderFooterXml(band,PG,where,rid,cx,cy), logo:logoMedia});
  }
  const hfPart = w => `${w}1.xml`;
  const hfRid = w => w==="header" ? "rIdHdr" : "rIdFtr";
  const sectExtra = hf.map(h=>`<w:${h.where}Reference w:type="default" r:id="${hfRid(h.where)}"/>`).join("");
  /* Two columns: the title, byline and abstract sit in a one-column section of
     their own, ended by a continuous break, and the body follows in columns. */
  if((F.columns||1)>1 && frontEnd>0){
    const pgXml=`<w:pgSz w:w="${tw(G.w)}" w:h="${tw(G.h)}"${F.page.orientation==="landscape"?' w:orient="landscape"':""}/><w:pgMar w:top="${tw(G.m.top)}" w:right="${tw(G.m.right)}" w:bottom="${tw(G.m.bottom)}" w:left="${tw(G.m.left)}" w:header="${tw(F.page.headerGap||8)}" w:footer="${tw(F.page.footerGap||8)}"/>`;
    parts.splice(frontEnd,0,`<w:p><w:pPr><w:spacing w:after="0"/><w:sectPr>${sectExtra}<w:type w:val="continuous"/>${pgXml}<w:cols w:num="1"/></w:sectPr></w:pPr></w:p>`);
  }

  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main\" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
 xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
<w:body>${parts.join("")}<w:sectPr>${sectExtra}<w:pgSz w:w="${tw(G.w)}" w:h="${tw(G.h)}"${F.page.orientation==="landscape"?' w:orient="landscape"':""}/><w:pgMar w:top="${tw(G.m.top)}" w:right="${tw(G.m.right)}" w:bottom="${tw(G.m.bottom)}" w:left="${tw(G.m.left)}" w:header="${tw(F.page.headerGap||8)}" w:footer="${tw(F.page.footerGap||8)}"/>${(F.columns||1)>1?`<w:cols w:num="${F.columns}" w:space="${tw(F.columnGap||6)}"/>`:""}</w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr>${wFont(F.fonts.body)}<w:sz w:val="${wSz(F.fonts.body.size)}"/>${wCol(F.fonts.body.colour)}</w:rPr></w:rPrDefault></w:docDefaults>
${[["Normal","Normal","",`<w:spacing w:after="${Math.round((F.paraGap??6)*20)}" w:line="${Math.round((F.fonts.body.lineHeight||1.4)*240)}" w:lineRule="auto"/>${F.paraIndent?`<w:ind w:firstLine="${Math.round(F.paraIndent*F.fonts.body.size*20)}"/>`:""}<w:jc w:val="${JC}"/>`],
   ["Title","Title",`${wFont(F.fonts.title)}<w:sz w:val="${wSz(F.fonts.title.size)}"/>${+F.fonts.title.weight>=600?"<w:b/>":""}${wCol(F.fonts.title.colour)}`,`<w:spacing w:after="160"/><w:jc w:val="${F.fonts.title.align==="center"?"center":"left"}"/>`],
   ["Authors","Authors",`${wFont(F.fonts.authors)}<w:sz w:val="${wSz(F.fonts.authors.size)}"/>${F.fonts.authors.italic?"<w:i/>":""}${wCol(F.fonts.authors.colour)}`,`<w:spacing w:after="60"/><w:jc w:val="${F.fonts.title.align==="center"?"center":"left"}"/>`],
   ["Affil","Affiliations",`${wFont(F.fonts.affiliations)}<w:sz w:val="${wSz(F.fonts.affiliations.size)}"/>${F.fonts.affiliations.italic?"<w:i/>":""}${wCol(F.fonts.affiliations.colour)}`,`<w:spacing w:after="240"/><w:jc w:val="${F.fonts.title.align==="center"?"center":"left"}"/>`],
   ["Heading2","Heading 2",`${wFont(F.fonts.h1)}${+F.fonts.h1.weight>=600?"<w:b/>":""}${F.fonts.h1.italic?"<w:i/>":""}${F.fonts.h1.transform==="uppercase"?"<w:caps/>":""}<w:sz w:val="${wSz(F.fonts.h1.size)}"/>${wCol(F.fonts.h1.colour)}`,'<w:spacing w:before="280" w:after="100"/><w:keepNext/><w:jc w:val="left"/>'],
   ["Heading3","Heading 3",`${wFont(F.fonts.h2)}${+F.fonts.h2.weight>=600?"<w:b/>":""}${F.fonts.h2.italic?"<w:i/>":""}<w:sz w:val="${wSz(F.fonts.h2.size)}"/>${wCol(F.fonts.h2.colour)}`,'<w:spacing w:before="200" w:after="80"/><w:keepNext/><w:jc w:val="left"/>'],
   ["Abstract","Abstract",`${wFont(F.fonts.abstract)}<w:sz w:val="${wSz(F.fonts.abstract.size)}"/>${wCol(F.fonts.abstract.colour)}`,`${F.fonts.abstract.style==="rule"?'<w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="'+(F.colours.rule||"#000").replace("#","")+'"/></w:pBdr>':F.fonts.abstract.style==="box"?'<w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="4" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="4" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="4" w:color="000000"/></w:pBdr>':""}<w:spacing w:after="160"/>`],
   ["Caption","Caption",`${wFont(F.fonts.caption)}<w:sz w:val="${wSz(F.fonts.caption.size)}"/>${wCol(F.fonts.caption.colour)}`,`<w:spacing w:after="240"/><w:jc w:val="${({justify:"both",center:"center"})[F.fonts.caption.align]||"left"}"/>`],
   ["Biblio","Bibliography",`${wFont(F.fonts.references)}<w:sz w:val="${wSz(F.fonts.references.size)}"/>${wCol(F.fonts.references.colour)}`,'<w:spacing w:after="60"/><w:ind w:left="360" w:hanging="360"/><w:jc w:val="left"/>'],
   ["ListParagraph","List Paragraph",'','<w:spacing w:after="60"/><w:ind w:left="720"/><w:contextualSpacing/>']]
  .map(([id,nm,rpr,ppr])=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${nm}"/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`).join("")}
</w:styles>`;
  /* Two abstract numberings — a bullet and a decimal — and one concrete list
     each. Word renumbers an ordered list itself; what the author typed as "1."
     is only a marker in the source text. */
  const numbering=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>
<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/><w:lvlJc w:val="left"/>
<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr><w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:hint="default"/></w:rPr></w:lvl></w:abstractNum>
<w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>
<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/>
<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>
<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>
<w:num w:numId="2"><w:abstractNumId w:val="1"/></w:num>
</w:numbering>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rIdN" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>
${hf.map(h=>`<Relationship Id="${hfRid(h.where)}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/${h.where}" Target="${hfPart(h.where)}"/>`).join("")}
${media.map((m,i)=>`<Relationship Id="rId${100+i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("")}
</Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>
${hf.map(h=>`<Override PartName="/word/${hfPart(h.where)}" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.${h.where}+xml"/>`).join("")}</Types>`;
  const root=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const enc=new TextEncoder();
  const entries=[
    {name:"[Content_Types].xml",data:enc.encode(ct)},
    {name:"_rels/.rels",data:enc.encode(root)},
    {name:"word/document.xml",data:enc.encode(doc)},
    {name:"word/styles.xml",data:enc.encode(styles)},
    {name:"word/numbering.xml",data:enc.encode(numbering)},
    {name:"word/_rels/document.xml.rels",data:enc.encode(rels)}
  ].concat(media.map(m=>({name:"word/media/"+m.name,data:b64ToBytes(m.b64)})))
   .concat(hf.flatMap(h=>{
     const out=[{name:"word/"+hfPart(h.where),data:enc.encode(h.xml)}];
     if(h.logo){
       out.push({name:"word/media/"+h.logo.name,data:b64ToBytes(h.logo.b64)});
       out.push({name:`word/_rels/${hfPart(h.where)}.rels`,data:enc.encode(
         `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rIdLogo" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${h.logo.name}"/></Relationships>`)});
     }
     return out;
   }));
  const blob=zipBlob(entries);
  const name=`${S.kind}-${sub}.docx`;
  const ns=await dlNamespace();
  const ok = await saveFile(name,blob);
  modal("Word export",`<div class="stack">
    <div class="note"><strong>${esc(name)} · ${(blob.size/1024).toFixed(0)} KB · ${media.length} embedded image${media.length===1?"":"s"}.</strong>
    Real OOXML: Title, Authors, Affiliations, Heading 2, Abstract, Caption and Bibliography paragraph styles; figures rasterised at 2× in the publication colour set; equations rendered from the LaTeX.</div>
    ${ns? (ok?`<div class="note"><strong>Saved.</strong> Open it in Word and check the styles — they are real Word styles, so restyling the whole document is a style-pane edit rather than a find-and-replace.</div>`
             :`<div class="note w"><strong>Not saved.</strong> The save was declined or unavailable. Try again from the button below.</div>`)
        : `<div class="note"><strong>Saved through the browser.</strong> Opened as a local file or served normally, the download runs as usual. In the desktop edition it is written straight into <span class="mono">${esc(S.dir)}</span> instead.</div>`}
  </div>`,`${ns?'<button class="btn p" id="reSave">Save again</button>':""}<button class="btn" data-close>Close</button>`);
  const rs=$("#reSave"); if(rs) rs.onclick=()=>saveFile(name,blob);
}

/* ============================ DRAFT LOG / TRACK CHANGES ============================ */
function plainDoc(state,which){
  const sd=(state.subdocs||{})[which||sub]; if(!sd) return "";
  const head=(which||sub)==="manuscript" ? (state.title||"")+"\n\n"+(state.abstract||"")+"\n\n" : "";
  return head+sd.sections.map(s=>s.title+"\n"+(s.blocks||[]).map(b=>
    b.type==="fig"?`[Figure ${b.figRef}]` : b.type==="gantt"?`[Gantt chart: ${b.caption||""}]` : b.type==="eq"?`[Equation ${b.label||""}: ${b.latex||""}]` : (b.text||"")
  ).join("\n")).join("\n\n");
}
function tokenise(t){ return t.split(/(\s+)/).filter(x=>x!==""); }
function diffTokens(a,b){
  const n=a.length,m=b.length;
  if(n*m>900000){ return [{t:"del",v:a.join("")},{t:"ins",v:b.join("")}]; }
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]= a[i]===b[j]? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  const push=(t,v)=>{ const l=out[out.length-1]; if(l&&l.t===t) l.v+=v; else out.push({t,v}); };
  while(i<n&&j<m){ if(a[i]===b[j]){ push("same",a[i]); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ push("del",a[i]); i++; } else { push("ins",b[j]); j++; } }
  while(i<n) push("del",a[i++]); while(j<m) push("ins",b[j++]);
  return out;
}
function diffHTML(oldT,newT){
  return diffTokens(tokenise(oldT),tokenise(newT)).map(p=>{
    const v=esc(p.v).replace(/\n/g,"<br>");
    return p.t==="same"?v : p.t==="ins"?`<ins>${v}</ins>` : `<del>${v}</del>`;
  }).join("");
}

/* ============================ REVIEWER RESPONSE ============================ */
function splitReport(text){
  const lines=text.split(/\r?\n/);
  const out=[]; let cur=null;
  const isHead=l=>/^\s*(comment\s*)?(\(?\d{1,2}[.):]|[-•*])\s+/i.test(l) || /^\s*(major|minor)\s+(point|comment)/i.test(l);
  for(const l of lines){
    if(!l.trim()){ if(cur&&cur.text.trim()) { out.push(cur); cur=null; } continue; }
    if(isHead(l)){ if(cur&&cur.text.trim()) out.push(cur); cur={id:uid("c"),text:l.replace(/^\s*(comment\s*)?(\(?\d{1,2}[.):]|[-•*])\s+/i,"").trim(),response:"",status:"open"}; }
    else if(cur) cur.text+=" "+l.trim();
    else cur={id:uid("c"),text:l.trim(),response:"",status:"open"};
  }
  if(cur&&cur.text.trim()) out.push(cur);
  return out.filter(c=>c.text.length>12);
}

/* ---------- the plan ----------

function eqBlocksInOrder(){
  const out=[], keys=SUBDOCS[S.kind].map(x=>x.k);

function depositTreeFrom(nodes){
  const root={path:"",note:"",dirs:[],files:[]}, index={"":root};
  const ensure=path=>{
    if(index[path]) return index[path];
    const cut=path.lastIndexOf("/"), parent=ensure(cut<0?"":path.slice(0,cut));
    const d={path,note:"",dirs:[],files:[]};
    index[path]=d; parent.dirs.push(d); return d;
  };
  (nodes||[]).forEach(nd=>{
    if(nd.kind==="dir"){ ensure(nd.path).note=nd.note||""; return; }
    const cut=nd.path.lastIndexOf("/");
    ensure(cut<0?"":nd.path.slice(0,cut)).files.push(nd);
  });
  return root;
}

/* ---------- previews ----------

function csvRows(csv){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<csv.length;i++){ const ch=csv[i];
    if(q){ if(ch==='"'){ if(csv[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=="");
}
function csvPreviewHTML(csv){
  const rows=csvRows(csv);

    <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${rows.length>201?`<div class="drole" style="margin-top:8px">${rows.length-201} more rows.</div>`:""}</div>`;
}

/* ---------- what the interface renders for the backend ---------- */
/* A standalone SVG cannot resolve the page's custom properties, so the few the
   charts use are resolved to the ink they stand for. */
const SVG_VARS={"--paper":"#ffffff","--sunk":"#F4F6FA","--line":"#E3E8F0","--line-strong":"#C9D2E3",
  "--ink":"#12161F","--body":"#2B3242","--muted":"#5A6478","--faint":"#8892AB","--brand":"#175FFF"};
function svgStandalone(s){
  return String(s).replace(/var\(\s*(--[a-z-]+)\s*\)/g,(m,v)=>SVG_VARS[v]||"#000000")
                  .replace(/currentColor/g,"#000000");
}
function htmlToText(html){
  const d=document.createElement("div"); d.innerHTML=html;
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
function wrapLines(text,width){
  const words=text.split(" "), out=[]; let line="";
  words.forEach(w=>{ if(!line) line=w; else if((line+" "+w).length<=width) line+=" "+w; else { out.push(line); line=w; } });
  if(line) out.push(line);
  return out.length?out:[""];
}
/* The panels as figureHTML lays them out, composed into one standalone SVG:
   the same grid geometry, absolutely placed, with the caption set below. */
function composeFigureSVG(f){
  const host=document.createElement("div");
  host.innerHTML=figureHTML(f,{print:true});
  const slots=[...host.querySelectorAll(".figgrid > .slot")];
  const L=layoutOf(f), G=cellGeom(L), areaMode=L.areas[0].includes(" ");
  const W=960, PAD=12, cellW=W/G.nCols, gridH=Math.round(W/G.A), cellH=gridH/G.nRows;
  const pos=[];
  if(areaMode){
    const m=L.areas.map(r=>r.trim().split(/\s+/));
    f.panels.forEach((p,i)=>{
      const name=letters[i]; let c0=1e9,r0=1e9,c1=-1,r1=-1;
      m.forEach((row,ri)=>row.forEach((v,ci)=>{ if(v===name){
        c0=Math.min(c0,ci); r0=Math.min(r0,ri); c1=Math.max(c1,ci); r1=Math.max(r1,ri); } }));
      pos.push(c1<0?{c:0,r:0,cs:1,rs:1}:{c:c0,r:r0,cs:c1-c0+1,rs:r1-r0+1});
    });
  } else f.panels.forEach((p,i)=>pos.push({c:i%G.nCols,r:Math.floor(i/G.nCols),cs:1,rs:1}));
  let body="";
  slots.forEach((slot,i)=>{
    const p=pos[i]||{c:0,r:0,cs:1,rs:1};
    const x=Math.round(p.c*cellW)+PAD, y=Math.round(p.r*cellH)+PAD;
    const w=Math.max(10,Math.round(p.cs*cellW)-2*PAD), h=Math.max(10,Math.round(p.rs*cellH)-2*PAD);
    const inner=slot.querySelector("svg"), img=slot.querySelector("img");
    if(inner){
      const vb=inner.getAttribute("viewBox")||`0 0 ${w} ${h}`;
      body+=`<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner.innerHTML}</svg>`;
    } else if(img){
      body+=`<image x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet" href="${esc(img.getAttribute("src")||"")}"/>`;
    } else {
      body+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#C9D2E3" stroke-dasharray="5 4"/>`;
    }
    if(f.panels.length>1)
      body+=`<text x="${x+3}" y="${y+16}" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#000000">${esc(letters[i]||"")}</text>`;
  });
  const lines=wrapLines(htmlToText(composedCaption(f)),132);
  const capTop=gridH+PAD+6;
  lines.forEach((ln,i)=>{
    body+=`<text x="${PAD}" y="${capTop+14+i*17}" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">${esc(ln)}</text>`;
  });
  const H=capTop+14+lines.length*17+PAD;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`
    +`<rect width="${W}" height="${H}" fill="#ffffff"/>${body}</svg>`;
  return {svg:svgStandalone(svg),w:W,h:H};
}
function csvCell(v){ const s=String(v==null?"":v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function tableCsv(t){
  const tc=tableCells(t);
  return [tc.head.map(h=>csvCell(richPlain(String(h)))).join(",")]
    .concat(tc.rows.map(r=>r.map(c=>csvCell(richPlain(String(c)))).join(","))).join("\n")+"\n";
}
/* x and every series as columns. Series that do not share an x get their own x
   column beside them rather than being forced onto someone else's. */
function plotCsv(p){
  const ser=(p.series||[]), xlab=richPlain(axText(p.xAxis||{}))||"x";
  if(!ser.length) return xlab+"\n";
  const first=ser[0].x||[];
  const shared=ser.every(s=>(s.x||[]).length===first.length&&(s.x||[]).every((v,i)=>v===first[i]));
  if(shared){
    const head=[xlab].concat(ser.map((s,i)=>richPlain(s.name||("series "+(i+1)))));
    const rows=first.map((x,i)=>[x].concat(ser.map(s=>(s.y||[])[i])));
    return [head.map(csvCell).join(",")].concat(rows.map(r=>r.map(csvCell).join(","))).join("\n")+"\n";
  }
  const head=[], cols=[];
  ser.forEach((s,i)=>{ const nm=richPlain(s.name||("series "+(i+1)));
    head.push(xlab+" ("+nm+")",nm); cols.push(s.x||[],s.y||[]); });
  const n=cols.reduce((m,c)=>Math.max(m,c.length),0);
  const rows=[];
  for(let i=0;i<n;i++) rows.push(cols.map(c=>c[i]===undefined?"":c[i]));
  return [head.map(csvCell).join(",")].concat(rows.map(r=>r.map(csvCell).join(","))).join("\n")+"\n";
}
async function buildRendered(){

      catch(e){ png=null; }

    figures.push({ref:f.ref,svg,png_base64:png});

    plots:(S.plots||[]).map(p=>({ref:p.ref,csv:plotCsv(p),spec:p})),

function attachmentPath(a){ return a.rel_path||("data/"+targetFolder(a.target)+"/"+a.name); }

async function attachFromInput(e){
  const ref=e.target.dataset.attach, files=[...e.target.files];

    if(typeof DESK!=="undefined" && DESK.online){

/* DEPOSIT.md, in the same shape the backend writes, so a zip and a folder read

function depositMarkdown(entries){
  const atts=S.attachments||[], names=S.authors.map(a=>a.name).filter(Boolean);
  const lines=[`# ${S.title}`,"",`**Authors** — ${names.join(", ")||"—"}  `,
    `**Compiled** — ${nowISO()}  `,`**Document kind** — ${S.kind}`,"",
    "This folder was compiled by GerbilDocs. Everything below was generated",
    "from the document, except the raw data, which was supplied by the",
    "authors and is listed with its checksum.",""];
  const repo=(S.repo||"").trim(), doi=(S.datasetDoi||"").trim();
  if(repo||doi) lines.push("## Data availability","",
    `The data underpinning this study are openly available from ${repo||"the repository named below"}${doi?" at "+doi:""}.`,"");
  lines.push("## Files","","| File | What it is | Size |","| --- | --- | --- |");
  entries.forEach(e=>lines.push(`| \`${e.path}\` | ${e.role} | ${fmtBytes(e.bytes)} |`));
  atts.forEach(a=>lines.push(`| \`${attachmentPath(a)}\` | raw data for ${a.target||"unassigned"} | ${fmtBytes(a.bytes||0)} |`));
  lines.push("");
  if(atts.length){
    lines.push("## Raw data checksums","","| File | sha256 | Note |","| --- | --- | --- |");
    atts.forEach(a=>lines.push(`| \`${attachmentPath(a)}\` | \`${a.sha256||"—"}\` | ${(a.note||"").replace(/\|/g,"/")} |`));
    lines.push("");
  }

}
/* The same set the backend would write, as a zip, for a page with no vault. */
function depositZipFiles(rendered){
  const enc=new TextEncoder(), files=[], entries=[];
  const add=(name,data,role)=>{ files.push({name,data}); entries.push({path:name,role,bytes:data.length}); };
  const text=(name,s,role)=>add(name,enc.encode(s),role);
  rendered.figures.forEach(fg=>{
    const i=S.figures.findIndex(x=>x.ref===fg.ref)+1; if(!i) return;
    const d=`figures/figure-${pad2(i)}`, stem=`figure-${pad2(i)}`;
    if(fg.svg) text(`${d}/${stem}.svg`,fg.svg,`figure ${fg.ref} (vector)`);
    if(fg.png_base64) add(`${d}/${stem}.png`,b64ToBytes(fg.png_base64),`figure ${fg.ref} (raster)`);
    (S.figures[i-1].panels||[]).filter(p=>p.src).forEach(p=>{
      const spec=(S.plots||[]).find(x=>x.id===p.src);
      if(spec) text(`${d}/${p.src}.plotspec.json`,JSON.stringify(spec,null,2),`plot specification for ${p.src}`);
    });
  });
  rendered.tables.forEach(tb=>{
    const i=S.tables.findIndex(x=>x.ref===tb.ref)+1; if(!i||!tb.csv) return;
    text(`tables/table-${pad2(i)}/table-${pad2(i)}.csv`,tb.csv,`table ${tb.ref}`);
  });
  rendered.plots.forEach(pl=>{ if(pl.csv) text(`plots/${pl.ref}.csv`,pl.csv,`plotted values for ${pl.ref}`); });
  rendered.equations.forEach((eq,i)=>{
    if(!(eq.latex||"").trim()) return;
    const n=i+1, body=`% equation ${n}${eq.label?" — "+eq.label:""}${eq.numbered?"":" (unnumbered)"}\n${eq.latex}\n`;
    text(`equations/equation-${pad2(n)}.tex`,body,`equation ${n}${eq.label?" ("+eq.label+")":""}`);
  });
  text("DEPOSIT.md",depositMarkdown(entries),"what is in this folder");
  return files;
}
async function compileDeposit(){
  const btn=$("#depCompile"), was=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Compiling…"; }
  try{
    const rendered=await buildRendered();
    histFinalize();   // nothing below is the direct result of an event
    if(vaultOnline()&&DESK.docId){
      const r=await DESK.compileDeposit(rendered);
      if(r&&Array.isArray(r.tree)) depositNodes=r.tree;
      S.depositAt=nowISO(); save();
      const c=(r&&r.counts)||{};
      render();
      toast(`Deposit compiled — ${c.figures||0} figures, ${c.tables||0} tables, ${c.plots||0} plots, ${c.equations||0} equations, ${fmtBytes((r&&r.bytes)||0)} written`);
    } else {
      const files=depositZipFiles(rendered);
      await saveFile(slug(S.title).slice(0,40)+"-deposit.zip",zipBlob(files));

      render();

    console.warn("compile failed",e);

}

function stampBlock(b){ if(!S.me) return; b.by=S.me.name; b.at=nowISO(); }
function contributions(){
  const revs=[...S.revisions].filter(r=>r.snapshot).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const out={};
  let prev=null;
  revs.forEach(r=>{
    const a=prev?plainAll(prev.snapshot):"", b=plainAll(r.snapshot);
    const d=diffTokens(tokenise(a),tokenise(b));
    const add=d.filter(x=>x.t==="ins").reduce((s,x)=>s+x.v.trim().split(/\s+/).filter(Boolean).length,0);
    const del=d.filter(x=>x.t==="del").reduce((s,x)=>s+x.v.trim().split(/\s+/).filter(Boolean).length,0);
    const k=r.by||"unknown";
    out[k]=out[k]||{revs:0,add:0,del:0,amend:0};
    out[k].revs++; out[k].add+=add; out[k].del+=del; if(r.kind==="amendment") out[k].amend++;

  });
  return out;
}

function refType(r){ return r.type && REF_TYPES.some(t=>t.k===r.type) ? r.type
  : (r.type === "JOUR" || !r.type) ? "article-journal" : "article-journal"; }
/* Built-ins first, then the user's own. One lookup, so everything that reads a
   template — the compliance check, the byline, the page furniture — gets the
   user's as readily as ours. */
function templateById(id){
  return TEMPLATES.find(t => t.id === id) || (S && S.templates || []).find(t => t.id === id) || null;
}
function userTemplates(){ return (S && S.templates) || []; }
function isUserTemplate(id){ return userTemplates().some(t => t.id === id); }
const BLANK_BAND = () => ({left:"", centre:"", right:"", logo:null, logoSide:"left"});
function pageSetup(tpl){
  const p = (tpl && tpl.page) || {};
  return {
    header: Object.assign(BLANK_BAND(), p.header),
    footer: Object.assign(BLANK_BAND(), p.footer),
    pageNumbers: !!p.pageNumbers,
    numberIn: p.numberIn || "footer-centre"
  };
}
function hasFurniture(P){
  const any = b => b.left || b.centre || b.right || b.logo;
  return any(P.header) || any(P.footer) || P.pageNumbers;
}

const HF_TOKENS = [["{title}","the document title"],["{runningHead}","the running head"],
  ["{authors}","the author list"],["{firstAuthor}","the first author's surname"],
  ["{date}","today's date"],["{year}","this year"],["{pages}","the number of pages"],["{doc}","the sub-document name, e.g. Manuscript"],
  ["{page}","the page number"]];
function hfText(str, pageNo){
  const first = splitName((S.authors[0]||{}).name || "").last;
  return String(str||"")
    .replace(/\{title\}/g, S.title||"")
    .replace(/\{runningHead\}/g, S.runningHead||S.title||"")
    .replace(/\{authors\}/g, S.authors.map(a=>a.name).join(", "))
    .replace(/\{firstAuthor\}/g, first||"")
    .replace(/\{date\}/g, fmtDay(nowISO()))
    .replace(/\{year\}/g, String(new Date().getFullYear()))
    .replace(/\{pages\}/g, pageNo==null ? "\u2014" : String((pvPageCount||0)||"\u2014"))
    .replace(/\{doc\}/g, (SUBDOCS[S.kind].find(x=>x.k===sub)||{}).l || "")
    .replace(/\{page\}/g, pageNo==null ? "\u2014" : String(pageNo));
}
/* One band, three slots and an optional logo. `pageNo` is null where nothing
   can count pages. */
function bandHTML(band, where, P, pageNo){
  const slots = {left:hfText(band.left,pageNo), centre:hfText(band.centre,pageNo), right:hfText(band.right,pageNo)};
  if(P.pageNumbers){
    const [w,slot] = (P.numberIn||"footer-centre").split("-");
    if(w===where){ const n = pageNo==null ? "\u2014" : String(pageNo);
      slots[slot] = (slots[slot]?slots[slot]+" ":"") + n; }
  }
  if(!slots.left && !slots.centre && !slots.right && !band.logo) return "";
  const img = band.logo ? `<img src="${band.logo}" alt="">` : "";
  return `<div class="pgband ${where==="header"?"head":"foot"}">`
    + (band.logo && band.logoSide!=="right" ? img : "")
    + `<div class="l">${esc(slots.left)}</div><div class="c">${esc(slots.centre)}</div><div class="r">${esc(slots.right)}</div>`
    + (band.logo && band.logoSide==="right" ? img : "")
    + `</div>`;
}

/* Non-journal references are formatted here; journal articles keep the four
   style functions. Enough to be right, not a substitute for citeproc. */
function bibOther(r, style){
  const t = refType(r), A = style==="acs" ? authACS(r) : style==="rsc" ? authRSC(r)
          : style==="apa" ? authAPA(r) : authWiley(r);
  const y = esc(r.year), ttl = esc(r.title);
  const pub = [esc(r.publisher), esc(r.place)].filter(Boolean).join(", ");
  if (t === "book") return `${A} <i>${ttl}</i>${r.edition?`, ${esc(r.edition)} ed.`:""}; ${pub}, ${y}.`;
  if (t === "chapter") return `${A} ${ttl}. In <i>${esc(r.containerTitle)}</i>${r.editors?`; ${esc(r.editors)}, Eds.`:""}; ${pub}, ${y}; pp ${esc(r.pages)}.`;
  if (t === "thesis") return `${A} <i>${ttl}</i>. ${esc(r.genre||"Thesis")}, ${pub}, ${y}.`;
  if (t === "paper-conference") return `${A} ${ttl}. In <i>${esc(r.containerTitle)}</i>, ${esc(r.place)}, ${y}; pp ${esc(r.pages)}.`;
  if (t === "patent") return `${A} ${ttl}. ${esc(r.number)}, ${y}.`;
  if (t === "dataset") return `${A} <i>${ttl}</i>${r.version?` (v${esc(r.version)})`:""} [dataset]. ${esc(r.publisher)}, ${y}. https://doi.org/${esc(r.doi)}`;
  if (t === "software") return `${A} <i>${ttl}</i>${r.version?` v${esc(r.version)}`:""} [software]. ${esc(r.publisher)}, ${y}.${r.doi?` https://doi.org/${esc(r.doi)}`:""}`;
  if (t === "report") return `${A} <i>${ttl}</i>${r.number?`, ${esc(r.number)}`:""}. ${esc(r.publisher)}, ${y}.`;
  if (t === "standard") return `${esc(r.publisher||r.authors[0]||"")} ${esc(r.number)}: <i>${ttl}</i>, ${y}.`;
  if (t === "webpage") return `${A} ${ttl}. ${esc(r.containerTitle||"")} ${esc(r.url)}${r.accessed?` (accessed ${esc(r.accessed)})`:""}.`;
  if (t === "article") return `${A} ${ttl}. <i>${esc(r.journal||"Preprint")}</i> ${y}.${r.doi?` https://doi.org/${esc(r.doi)}`:""}`;
  return null;
}

/* ------------------------------- template compliance ---------------------- */
function templateCheck(){
  const tpl = templateById(S.templateId);
  if (!tpl) return null;
  const have = orderedSections("manuscript").filter(x=>secLevel(x)===1).map(x=>x.title.toLowerCase());
  const missing = tpl.sections.filter(want =>
    !have.some(h => h.includes(want.toLowerCase()) || want.toLowerCase().includes(h)));
  const ab = abstractStatus();
  const issues = [];
  if (missing.length) issues.push({kind:"section", text:`Missing: ${missing.join(", ")}`});
  if (ab.w > (tpl.abstractLimit||ab.lim)) issues.push({kind:"abstract",
    text:`Abstract is ${ab.w} words against a limit of ${tpl.abstractLimit}`});
  if (tpl.abstractMin && ab.w && ab.w < tpl.abstractMin) issues.push({kind:"abstract",
    text:`Abstract is ${ab.w} words; this journal asks for at least ${tpl.abstractMin}`});
  const kw = (S.keywords||[]).filter(Boolean).length;
  if (tpl.keywordsMin && kw && kw < tpl.keywordsMin) issues.push({kind:"keywords",
    text:`${kw} keyword${kw===1?"":"s"}; this journal asks for at least ${tpl.keywordsMin}`});
  if (tpl.keywordsMin && !kw) issues.push({kind:"keywords",
    text:`No keywords; this journal asks for ${tpl.keywordsMin}\u2013${tpl.keywordsMax}`});
  if (tpl.keywordsMax && kw > tpl.keywordsMax) issues.push({kind:"keywords",
    text:`${kw} keywords against a maximum of ${tpl.keywordsMax}`});
  if (tpl.limits && tpl.limits.references) {
    const n = bibliography().length, cap = parseInt(tpl.limits.references, 10);
    if (cap && n > cap) issues.push({kind:"refs", text:`${n} references cited against a limit of ${cap}`});
  }
  if (tpl.limits && tpl.limits.displayItems) {
    const n = S.figures.length + S.tables.length, cap = parseInt(tpl.limits.displayItems, 10);
    if (cap && n > cap) issues.push({kind:"display", text:`${n} figures and tables against about ${cap}`});
  }
  return {tpl, issues, missing};
}

/* Deriving from a built-in is the usual way in: take the RSC or ACS shape and
   put your own header on it. The copy is yours from then on. */
function deriveTemplate(id){
  const src=templateById(id); if(!src) return blankTemplate();
  const t=JSON.parse(JSON.stringify(src));
  t.id=uid("tpl"); t.family="My templates"; t.label=src.label+" (mine)"; t.mine=true;
  t.verified=false; t.source=""; t.page=pageSetup(src);
  return t;
}

    closeModal(); commit(`Template “${t2.label}” saved`);
  };
}
/* ============================ PROJECT PLAN ============================
   Grant furniture: aims and objectives, work packages, milestones and the
   Gantt chart drawn from them. Work packages and objectives are referenced
   in the text by id ([@wp:…], [@obj:…]) like samples, so renumbering a work
   package rewrites every mention. The Gantt is a block in the text, numbered
   with the figures. */
function projectOf(){ if(!S.project) S.project={aim:"",objectivesTitle:"Aims and objectives",showObjectives:false,objectives:[],wps:[],milestones:[],gantt:{months:36,start:"",unit:"month"}};
  const P=S.project; P.objectives=P.objectives||[]; P.wps=P.wps||[]; P.milestones=P.milestones||[]; P.gantt=Object.assign({months:36,start:"",unit:"month"},P.gantt||{}); return P; }
function renumberProject(){ const P=projectOf(); P.wps.forEach((w,i)=>w.code="WP"+(i+1)); P.objectives.forEach((o,i)=>o.code="O"+(i+1)); }
/* Month labels from a start like "Oct 2027" (or "2027-10"); plain M1… otherwise. */
function ganttMonthLabel(start,i,unit){
  const m=/^(\d{4})-(\d{1,2})$/.exec(start||"")||(()=>{ const d=Date.parse(start||""); if(isNaN(d)) return null; const x=new Date(d); return [null,String(x.getFullYear()),String(x.getMonth()+1)]; })();
  if(!m) return unit==="quarter" ? "Q"+(Math.floor(i/3)+1) : "M"+(i+1);
  const d=new Date(+m[1], +m[2]-1+i, 1);
  return unit==="quarter" ? (d.getMonth()%3===0 ? `Q${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}` : "") : d.toLocaleDateString("en-GB",{month:"short"})+(d.getMonth()===0||i===0?" "+String(d.getFullYear()).slice(2):"");
}
function ganttSVG(o){
  o=o||{}; const P=projectOf(), G=P.gantt, N=Math.max(1,Math.min(120,+G.months||36));
  const F=(typeof docFormat==="function")?docFormat().fonts.plot:{family:"sans",size:10,colour:"#000"};
  const fam=fontCSS(F.family).replace(/"/g,"'"), fs=Math.max(6,(+F.size||10)-1), ink=o.print?"#000":(F.colour||"#000");
  const rows=[]; P.wps.forEach(w=>{ rows.push({kind:"wp",w}); (w.tasks||[]).forEach(t=>rows.push({kind:"task",w,t})); });
  const labW=170, W=800, colW=(W-labW-10)/N, rowH=18, taskH=13, headH=G.unit==="quarter"?22:34;
  const H=headH+rows.reduce((a,r)=>a+(r.kind==="wp"?rowH:taskH),0)+(P.milestones.length?22:6)+4;
  const x=m=>labW+(Math.max(0,Math.min(N,m)))*colW;
  let out=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gantt chart" font-family="${fam}" font-size="${fs}">`;
  // shading and grid
  for(let i=0;i<N;i++){ const q=Math.floor(i/3)%2; if(q) out+=`<rect x="${x(i).toFixed(1)}" y="${headH}" width="${colW.toFixed(2)}" height="${H-headH}" fill="#000" fill-opacity=".045"/>`; }
  for(let i=0;i<=N;i++){ const yr=i%12===0; out+=`<line x1="${x(i).toFixed(1)}" y1="${headH-4}" x2="${x(i).toFixed(1)}" y2="${H}" stroke="${yr?"#888":"#ccc"}" stroke-width="${yr?1:.5}"/>`; }
  // header labels
  if(G.unit==="quarter"){ for(let i=0;i<N;i+=3){ const l=ganttMonthLabel(G.start,i,"quarter"); if(l) out+=`<text x="${(x(i)+x(Math.min(N,i+3)))/2}" y="${headH-8}" text-anchor="middle" fill="${ink}">${esc(l)}</text>`; } }
  else { for(let i=0;i<N;i++){ const l=ganttMonthLabel(G.start,i,"month"); if(colW>=14||i%3===0) out+=`<text x="${x(i)+colW/2}" y="${headH-8}" text-anchor="middle" fill="${ink}" font-size="${Math.min(fs,colW>=18?fs:fs-1.5)}">${esc(l.split(" ")[0])}</text>`;
      if(/ /.test(l)) out+=`<text x="${x(i)+2}" y="${headH-22}" fill="${ink}" font-weight="600">${esc(l.split(" ")[1]?"20"+l.split(" ")[1]:"")}</text>`; } }
  let y=headH;
  rows.forEach((r,ri)=>{ const h=r.kind==="wp"?rowH:taskH, col=r.w.colour||PALETTE[P.wps.indexOf(r.w)%PALETTE.length];
    const s=+(r.kind==="wp"?r.w.start:r.t.start)||1, e=+(r.kind==="wp"?r.w.end:r.t.end)||s;
    const x0=x(s-1), x1=x(Math.max(s,e));
    if(r.kind==="wp"){ out+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#ddd" stroke-width=".5"/>`;
      out+=`<text x="4" y="${y+h/2+fs*.35}" fill="${ink}" font-weight="700">${esc(r.w.code)}</text><text x="34" y="${y+h/2+fs*.35}" fill="${ink}">${esc((r.w.title||"").slice(0,28))}</text>`;
      out+=`<rect x="${x0.toFixed(1)}" y="${y+3}" width="${Math.max(2,x1-x0).toFixed(1)}" height="${h-6}" rx="2" fill="${col}"/>`; }
    else { out+=`<text x="18" y="${y+h/2+fs*.35}" fill="${ink}" font-size="${fs-1}">${esc((r.t.title||"").slice(0,32))}</text>`;
      out+=`<rect x="${x0.toFixed(1)}" y="${y+2.5}" width="${Math.max(2,x1-x0).toFixed(1)}" height="${h-5}" rx="1.5" fill="${col}" fill-opacity=".45"/>`; }
    y+=h; });
  if(P.milestones.length){ out+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#ddd" stroke-width=".5"/><text x="4" y="${y+13}" fill="${ink}" font-weight="700">Milestones</text>`;
    P.milestones.forEach((m,i)=>{ const mx=x(Math.max(0,(+m.month||1)-1)+.5); out+=`<path d="M${mx} ${y+4} l6 7 l-6 7 l-6 -7z" fill="${ink}"/><text x="${mx+9}" y="${y+14}" fill="${ink}" font-size="${fs-1}">${esc(m.code||"M"+(i+1))}${m.label?" "+esc(m.label.slice(0,18)):""}</text>`; }); }
  return out+`</svg>`;
}

          <div class="fld"><label>Overall aim (one or two sentences; optional)</label><textarea class="inp" id="prAim" rows="2" data-capfield="aim">${esc(P.aim||"")}</textarea></div>

            <span class="key" style="align-self:center">${esc(o.code)}</span>
            <div class="grow"><input class="inp" data-obj="${o.id}" data-capfield="obj" value="${esc(o.text)}" placeholder="What will be achieved, in one sentence"></div>
            <div class="acts"><button class="btn sm" data-objmv="${o.id}|-1" aria-label="Move up">↑</button><button class="btn sm" data-objmv="${o.id}|1" aria-label="Move down">↓</button><button class="btn sm danger" data-objdel="${o.id}" aria-label="Remove objective">×</button></div></li>`).join("")}</ul>`

        </div></div>
      <div class="panel"><header><h3>Gantt chart</h3><span class="chip">${ganttBlocks.length?ganttBlocks.map(g=>capLabel("fig",fn[g.b.id],false)+" in "+(SUBDOCS[S.kind].find(x=>x.k===g.w)||{}).l).join(", "):"not yet in the text"}</span></header>
        <div class="bd stack">
          <div class="row">
            <div class="fld" style="flex:0 0 120px"><label>Duration</label><div style="display:flex;gap:5px;align-items:center"><input class="inp" type="number" id="prMonths" min="1" max="120" value="${P.gantt.months}" style="max-width:80px"><span class="hint" style="font-size:11px;color:var(--muted)">months</span></div></div>
            <div class="fld"><label>Starts (optional, e.g. Oct 2027 or 2027-10)</label><input class="inp" id="prStart" value="${esc(P.gantt.start||"")}" placeholder="M1 if blank"></div>
            <div class="fld" style="flex:0 0 150px"><label>Columns</label><select class="inp" id="prUnit"><option value="month"${P.gantt.unit==="month"?" selected":""}>Months</option><option value="quarter"${P.gantt.unit==="quarter"?" selected":""}>Quarters</option></select></div>
          </div>
          <div class="figframe">${ganttSVG({})}</div>
          ${P.milestones.length?`<div class="fld"><label>Milestones</label><table class="edtable"><thead><tr><th>Code</th><th>Label</th><th>Month</th><th></th></tr></thead><tbody>${P.milestones.map((m,i)=>`<tr>
            <td><span class="key">M${i+1}</span></td><td><input class="inp" data-ms="${m.id}|label" value="${esc(m.label||"")}"></td>
            <td><input class="inp" type="number" min="1" max="${P.gantt.months}" data-ms="${m.id}|month" value="${m.month||1}" style="max-width:80px"></td>
            <td><button class="btn sm danger" data-msdel="${m.id}" aria-label="Remove milestone">×</button></td></tr>`).join("")}</tbody></table></div>`:""}
        </div></div>
    </div>
    <div class="stack">
      ${P.wps.length?P.wps.map((w,i)=>`<div class="panel" data-wp="${w.id}"><header><span class="key">${esc(w.code)}</span><input class="inp" data-wpf="${w.id}|title" value="${esc(w.title||"")}" placeholder="Work package title" style="max-width:280px;font-weight:600">
          <div class="acts"><span class="swatches">${PALETTE.map(c=>`<button data-wpcol="${w.id}|${c}" style="background:${c}" aria-pressed="${(w.colour||PALETTE[i%PALETTE.length])===c}" aria-label="Colour ${c}"></button>`).join("")}</span>
            <button class="btn sm" data-wpmv="${w.id}|-1" aria-label="Move up">↑</button><button class="btn sm" data-wpmv="${w.id}|1" aria-label="Move down">↓</button><button class="btn sm danger" data-wpdel="${w.id}">Remove</button></div></header>
        <div class="bd stack">
          <div class="row">
            <div class="fld"><label>Lead</label><input class="inp" data-wpf="${w.id}|lead" value="${esc(w.lead||"")}" placeholder="Who leads it"></div>
            <div class="fld" style="flex:0 0 110px"><label>Start month</label><input class="inp" type="number" min="1" max="${P.gantt.months}" data-wpf="${w.id}|start" value="${w.start||1}"></div>
            <div class="fld" style="flex:0 0 110px"><label>End month</label><input class="inp" type="number" min="1" max="${P.gantt.months}" data-wpf="${w.id}|end" value="${w.end||P.gantt.months}"></div>
          </div>
          <div class="fld"><label>Description (used when you reference it, and for your own planning)</label><textarea class="inp" rows="2" data-wpf="${w.id}|desc" data-capfield="wp">${esc(w.desc||"")}</textarea></div>
          <div class="fld"><label>Tasks <button class="btn sm" data-wptask="${w.id}" style="margin-left:6px">+ Task</button></label>
            ${(w.tasks||[]).length?`<table class="edtable"><thead><tr><th>Task</th><th>Start</th><th>End</th><th></th></tr></thead><tbody>${w.tasks.map(t=>`<tr>
              <td><input class="inp" data-wpt="${w.id}|${t.id}|title" value="${esc(t.title||"")}"></td>
              <td><input class="inp" type="number" min="1" data-wpt="${w.id}|${t.id}|start" value="${t.start||w.start||1}" style="max-width:80px"></td>
              <td><input class="inp" type="number" min="1" data-wpt="${w.id}|${t.id}|end" value="${t.end||w.end||1}" style="max-width:80px"></td>
              <td><button class="btn sm danger" data-wptdel="${w.id}|${t.id}" aria-label="Remove task">×</button></td></tr>`).join("")}</tbody></table>`:'<div class="meta">No tasks — the work package is one bar.</div>'}</div>
        </div></div>`).join("")
      :'<div class="empty">No work packages yet. Add one; it appears on the Gantt chart and can be referenced in the text as WP1.</div>'}
    </div>
  </div>`;
}
function wireProject(){
  if(view!=="project") return;
  const P=projectOf();
  const ao=$("#prAddObj"); if(ao) ao.onclick=()=>{ P.objectives.push({id:uid("ob"),code:"",text:""}); renumberProject(); commit("Objective added"); };
  const aw=$("#prAddWp"); if(aw) aw.onclick=()=>{ const n=P.wps.length; P.wps.push({id:uid("wp"),code:"",title:"",lead:"",start:n?Math.min(P.gantt.months,(P.wps[n-1].end||1)+1):1,end:P.gantt.months,desc:"",tasks:[]}); renumberProject(); commit("Work package added"); };
  const am=$("#prAddMs"); if(am) am.onclick=()=>{ P.milestones.push({id:uid("ms"),label:"",month:Math.min(P.gantt.months,12*(P.milestones.length+1))}); commit("Milestone added"); };
  const ig=$("#prInsertGantt"); if(ig) ig.onclick=()=>{ const secs=S.subdocs[sub].sections; if(!secs.length) secs.push({id:uid("s"),kind:"heading",title:"Project plan",blocks:[]});
    const b={id:uid("b"),type:"gantt",caption:"Gantt chart of the work programme."}; secs[secs.length-1].blocks.push(b); view="write"; commit("Gantt chart inserted — move it with the arrows"); focusBlock(b.id); };
  const so=$("#prShowObj"); if(so) so.onchange=()=>{ P.showObjectives=so.checked; commit(so.checked?"Objectives box shown after the abstract":"Objectives box hidden"); };
  const ot=$("#prObjTitle"); if(ot) ot.oninput=()=>{ P.objectivesTitle=ot.value; save(); };
  const pa=$("#prAim"); if(pa) pa.oninput=()=>{ P.aim=pa.value; save(); acCheck(pa); };
  on("[data-obj]","input",e=>{ const o=objById(e.target.dataset.obj); if(o){ o.text=e.target.value; save(); acCheck(e.target); } });
  on("[data-objdel]","click",e=>{ P.objectives=P.objectives.filter(o=>o.id!==e.currentTarget.dataset.objdel); renumberProject(); commit("Objective removed — the rest renumbered",{undo:true}); });
  on("[data-objmv]","click",e=>{ const [id,d]=e.currentTarget.dataset.objmv.split("|"); const i=P.objectives.findIndex(o=>o.id===id), j=i+ +d; if(j<0||j>=P.objectives.length) return;
    [P.objectives[i],P.objectives[j]]=[P.objectives[j],P.objectives[i]]; renumberProject(); commit(); });
  const gm=$("#prMonths"); if(gm) gm.onchange=()=>{ P.gantt.months=Math.max(1,Math.min(120,+gm.value||36)); commit(); };
  const gs=$("#prStart"); if(gs) gs.onchange=()=>{ P.gantt.start=gs.value.trim(); commit(); };
  const gu=$("#prUnit"); if(gu) gu.onchange=()=>{ P.gantt.unit=gu.value; commit(); };
  on("[data-ms]","change",e=>{ const [id,k]=e.target.dataset.ms.split("|"); const m=P.milestones.find(x=>x.id===id); if(!m) return; m[k]= k==="month" ? (+e.target.value||1) : e.target.value; commit(); });
  on("[data-msdel]","click",e=>{ P.milestones=P.milestones.filter(m=>m.id!==e.currentTarget.dataset.msdel); commit("Milestone removed",{undo:true}); });
  on("[data-wpf]","input",e=>{ const [id,k]=e.target.dataset.wpf.split("|"); const w=wpById(id); if(!w) return;
    w[k]= (k==="start"||k==="end") ? (+e.target.value||1) : e.target.value; save(); if(k==="desc") acCheck(e.target);
    if(k==="start"||k==="end"){ const fr=$(".figframe"); if(fr) fr.innerHTML=ganttSVG({}); } });
  on("[data-wpf]","change",e=>{ const k=e.target.dataset.wpf.split("|")[1]; if(k==="start"||k==="end") commit(); });
  on("[data-wpcol]","click",e=>{ const [id,c]=e.currentTarget.dataset.wpcol.split("|"); const w=wpById(id); if(w){ w.colour=c; commit(); } });
  on("[data-wpmv]","click",e=>{ const [id,d]=e.currentTarget.dataset.wpmv.split("|"); const i=P.wps.findIndex(w=>w.id===id), j=i+ +d; if(j<0||j>=P.wps.length) return;
    [P.wps[i],P.wps[j]]=[P.wps[j],P.wps[i]]; renumberProject(); commit("Work packages renumbered"); });
  on("[data-wpdel]","click",e=>{ P.wps=P.wps.filter(w=>w.id!==e.currentTarget.dataset.wpdel); renumberProject(); commit("Work package removed — the rest renumbered",{undo:true}); });
  on("[data-wptask]","click",e=>{ const w=wpById(e.currentTarget.dataset.wptask); if(!w) return; (w.tasks=w.tasks||[]).push({id:uid("t"),title:"",start:w.start||1,end:w.end||1}); commit(); });
  on("[data-wpt]","input",e=>{ const [wid,tid,k]=e.target.dataset.wpt.split("|"); const w=wpById(wid), t=w&&(w.tasks||[]).find(x=>x.id===tid); if(!t) return;
    t[k]= (k==="start"||k==="end") ? (+e.target.value||1) : e.target.value; save(); const fr=$(".figframe"); if(fr) fr.innerHTML=ganttSVG({}); });
  on("[data-wptdel]","click",e=>{ const [wid,tid]=e.currentTarget.dataset.wptdel.split("|"); const w=wpById(wid); if(w){ w.tasks=(w.tasks||[]).filter(t=>t.id!==tid); commit("Task removed",{undo:true}); } });
}

/* ============================ FORMATTING VIEW ============================
   Every knob on the resolved format, edited as an override on the document.
   A change here is the document's; "Save as template" bakes the result into
   a template of your own so the next document starts from it. */
const FMT_FONT_OPTS = Object.keys(FONT_STACKS);
function fmtFontSel(path, cur){
  const known=FMT_FONT_OPTS.includes(cur);
  return `<select class="inp" data-fmt="${path}" data-ft="font">${FMT_FONT_OPTS.map(k=>`<option value="${k}"${k===cur?" selected":""}>${esc(FONT_STACKS[k].label)}</option>`).join("")}<option value="__custom"${known?"":" selected"}>Other… (type below)</option></select>
    ${known?"":`<input class="inp" data-fmt="${path}" data-ft="text" value="${esc(cur||"")}" placeholder="Font name as installed, e.g. Garamond" style="margin-top:4px">`}`;
}
function fmtNum(path, v, step, unit, min, max){ return `<div style="display:flex;align-items:center;gap:5px"><input class="inp" type="number" data-fmt="${path}" data-ft="num" value="${v??""}" step="${step||1}"${min!=null?` min="${min}"`:""}${max!=null?` max="${max}"`:""} style="max-width:92px">${unit?`<span class="hint" style="font-size:11px;color:var(--muted)">${esc(unit)}</span>`:""}</div>`; }
function fmtSel(path, v, opts){ return `<select class="inp" data-fmt="${path}" data-ft="text">${opts.map(([k,l])=>`<option value="${k}"${String(k)===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`; }
function fmtChk(path, v, label){ return `<label class="chip" style="justify-content:flex-start"><input type="checkbox" data-fmt="${path}" data-ft="bool" ${v?"checked":""}> ${esc(label)}</label>`; }
/* The first-line indent is a yes/no decision far more often than it is a
   measurement, so it gets a switch as well as the box. Turning it off keeps
   the size, so turning it back on returns to what the template asked for
   rather than to an arbitrary 1 em. */
let indentMemo=null;
function fmtIndentChk(v){ return `<label class="chip" style="justify-content:flex-start"><input type="checkbox" data-fmt="paraIndent" data-ft="indent" ${v?"checked":""}> Indent first line</label>`; }
function fmtCol(path, v){ return `<div style="display:flex;gap:6px;align-items:center"><input type="color" data-fmt="${path}" data-ft="text" value="${esc(/^#[0-9a-fA-F]{6}$/.test(v||"")?v:"#000000")}" style="width:36px;height:30px;padding:0;border:1px solid var(--line-strong);border-radius:6px;background:none"><span class="mono" style="font-size:11px;color:var(--muted)">${esc(v||"")}</span></div>`; }
function fmtTxt(path, v, ph){ return `<input class="inp" data-fmt="${path}" data-ft="text" value="${esc(v??"")}" placeholder="${esc(ph||"")}">`; }
const F_ = (label, inner, w) => `<div class="fld"${w?` style="flex:0 0 ${w}"`:""}><label>${esc(label)}</label>${inner}</div>`;
function fontGroup(title, key, x, extra){
  return `<div class="panel"><header><h3>${esc(title)}</h3></header><div class="bd stack">
    <div class="row">${F_("Font", fmtFontSel(`fonts.${key}.family`, x.family))}${x.size!==undefined?F_("Size", fmtNum(`fonts.${key}.size`, x.size, .5, "pt", 4, 72), "120px"):""}${F_("Colour", fmtCol(`fonts.${key}.colour`, x.colour||"#000000"), "140px")}</div>
    ${extra||""}</div></div>`;
}

}
function wireFormat(){
  const apply=(el)=>{ const path=el.dataset.fmt, t=el.dataset.ft; let v;
    if(t==="bool") v=el.checked;
    else if(t==="indent"){ const cur=docFormat().paraIndent||0;
      if(el.checked) v=indentMemo||1; else { if(cur) indentMemo=cur; v=0; } }
    else if(t==="num"){ v=parseFloat(el.value); if(!isFinite(v)) return; }
    else if(t==="font"){ if(el.value==="__custom"){ setFormat(path,"custom"); commit(); return; } v=el.value; }
    else v=el.value;
    if(path==="columns"||/\.weight$/.test(path)) v=+v;
    if(path==="align") setFormat("justify", v==="justify");
    setFormat(path,v); save();
    const g=$("#fmtGalley"); if(g){ g.style.cssText=formatVars(); g.innerHTML=previewDoc(); } };
  on("[data-fmt]","input",e=>{ if(e.target.dataset.ft!=="font"&&e.target.tagName!=="SELECT") apply(e.target); });
  on("[data-fmt]","change",e=>{ apply(e.target); if(e.target.tagName==="SELECT"||e.target.type==="checkbox") { const path=e.target.dataset.fmt; if(/columns|page\.|authorBlock|captions|figures|abstract\.style|h1\.transform|headings\.|^paraIndent$/.test(path)) render(); } });
  const fl=$("#fmtLang"); if(fl) fl.onchange=()=>{ S.lang=fl.value; applyLang(); commit(`Written in ${langLabel(S.lang)}`); };
  const fv=$("#fmtVariants"); if(fv) fv.onclick=openVariantReview;
  const fr=$("#fmtReset"); if(fr) fr.onclick=()=>{ S.format={}; commit("Formatting reset to the template",{undo:true}); };
  const fp=$("#fmtPreview"); if(fp) fp.onclick=()=>openPreview(sub);
  const fs=$("#fmtSaveTpl"); if(fs) fs.onclick=()=>{
    const base=templateById(S.templateId);
    modal("Save as template",`<div class="stack">
      <div class="fld"><label>Name</label><input class="inp" id="tplSaveName" value="${esc(base?base.label+" (mine)":"My "+fmtKind(S.kind).toLowerCase()+" template")}"></div>
      <div class="note">The template carries the whole format as it is now — page, columns, every font and colour, caption labels, figure defaults${base?`, plus the section list, notes and page header/footer of <b>${esc(base.label)}</b>`:""}. This document switches to it; other documents can choose it in Templates.</div>
    </div>`,`<button class="btn" data-close>Cancel</button><button class="btn p" id="tplSaveGo">Save</button>`);
    $("#tplSaveGo").onclick=()=>{
      const t = base ? deriveTemplate(base.id) : blankTemplate();
      t.label=$("#tplSaveName").value.trim()||t.label; t.format=docFormat(); t.kind=S.kind;
      delete t.affiliations; delete t.affMark;
      if(!S.templates) S.templates=[]; S.templates.push(t); S.templateId=t.id; S.format={};
      closeModal(); commit(`Template “${t.label}” saved and in use`); }; };
  const fu=$("#fmtUpdateTpl"); if(fu) fu.onclick=()=>{ const t=templateById(S.templateId); if(!t||!isUserTemplate(t.id)) return;
    t.format=docFormat(); delete t.affiliations; delete t.affMark; S.format={}; commit(`Template “${t.label}” updated with this formatting`); };
}

        <div class="bd stack">
          <ul style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.6">${cur.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>

          ${cur.headings?`<div class="note"><strong>Heading levels.</strong><ul style="margin:5px 0 0;padding-left:16px">${cur.headings.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`:""}
          ${cur.affiliations==="footnote"?`<div class="note"><strong>Addresses are footnotes</strong>, marked ${esc(cur.affMark==="letter"?"a, b, c":"1, 2, 3")} in the byline, not a block under the names. The preview and the exports follow this while this template is in use.</div>`:""}
          ${cur.limits?`<div class="note"><strong>Limits.</strong> ${Object.entries(cur.limits).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join("; ")}</div>`:""}
          ${(()=>{ const P=pageSetup(cur); if(!hasFurniture(P)) return "";
            const line=(b,w)=>[b.logo?"logo":"",b.left,b.centre,b.right].filter(Boolean).join(" · ")||"empty";
            return `<div class="note"><strong>Page furniture.</strong> Header: ${esc(line(P.header))}. Footer: ${esc(line(P.footer))}.${P.pageNumbers?` Page numbers ${esc((NUM_WHERE.find(x=>x.k===P.numberIn)||{}).l||"")}.`:" No page numbers."}</div>`; })()}

        <div class="bd stack">
          ${chk&&chk.issues.length

            : '<div class="note">Sections, abstract length and any limits all match.</div>'}
          <div class="fld"><label>Required statements</label>

        </div></div>`
      :`<div class="empty">Pick a template to check this document against it.</div>`}
      <div class="note"><strong>What a template is not.</strong> It never rewrites your text and never deletes a section. “Add missing sections” appends empty ones in the template's order; everything else here is advice you can ignore.</div>
    </div>

<script>
/* ============================ MODALS ============================ */
let modalState=null, modalOpener=null;
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function focusables(root){ return $$(FOCUSABLE,root).filter(el=>!el.hidden&&!el.closest("[hidden]")&&el.getClientRects().length); }
/* Tab and Shift+Tab stay inside the container while it is open. */
function trapFocus(root){ root.addEventListener("keydown",e=>{ if(e.key!=="Tab") return;
  const f=focusables(root); if(!f.length){ e.preventDefault(); return; }
  const i=f.indexOf(document.activeElement);
  if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); }
  else if(!e.shiftKey&&(i===-1||i===f.length-1)){ e.preventDefault(); f[0].focus(); } }); }
function focusFirst(root){ const f=focusables(root);
  const pick=f.find(el=>/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.closest(".bd"))||f.find(el=>el.closest("footer")&&el.classList.contains("p"))||f[0]||root;
  try{ pick.focus({preventScroll:true}); }catch(e){} }
function modal(title,bodyHTML,footHTML){
  if(!$("#scrim")) modalOpener=document.activeElement;
  closeAC();
  $("#modalHost").innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1">
    <header><h3>${esc(title)}</h3><div class="acts" style="margin-left:auto"><button class="btn sm" data-close>Close</button></div></header>
    <div class="bd">${bodyHTML}</div>${footHTML?`<footer>${footHTML}</footer>`:""}</div></div>`;
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim"||e.target.hasAttribute("data-close")) closeModal(); });
  const m=$("#modalHost .modal"); a11yLabels(m); trapFocus(m); focusFirst(m);
  /* Enter in a single-line field is the primary action, as in any dialog. */
  m.addEventListener("keydown",e=>{ if(e.key!=="Enter"||e.target.tagName!=="INPUT"||e.target.type==="checkbox"||e.target.dataset.c!==undefined||e.target.dataset.h!==undefined) return;
    const go=m.querySelector("footer .btn.p"); if(go&&!go.disabled){ e.preventDefault(); go.click(); } });
}
function closeModal(){ const host=$("#modalHost"); if(!host||!host.innerHTML) return; host.innerHTML=""; modalState=null;
  const o=modalOpener; modalOpener=null;
  if(o&&document.contains(o)&&o!==document.body){ try{ o.focus({preventScroll:true}); }catch(e){} } }

/* ============================ SEARCH: matcher shared by the palette and @ ============================ */
/* Whole query as a substring ranks first, then every word present, then a
   subsequence. -1 means no match. */
function fuzzy(q,text){
  if(!q) return 0; q=q.toLowerCase(); const t=String(text||"").toLowerCase();
  const i=t.indexOf(q); if(i>=0) return 300-Math.min(i,100);
  const toks=q.split(/\s+/).filter(Boolean);
  if(toks.length>1&&toks.every(k=>t.includes(k))) return 150;
  const cq=q.replace(/\s/g,""); if(cq.length<3) return -1;
  let ti=0,s=0; for(const c of cq){ const j=t.indexOf(c,ti); if(j<0) return -1; s+= j===ti?2:0; ti=j+1; } return 10+s; }
function hl(label,q){ const e=esc(label); q=(q||"").trim(); if(!q) return e;
  const i=label.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return e;
  return esc(label.slice(0,i))+"<mark>"+esc(label.slice(i,i+q.length))+"</mark>"+esc(label.slice(i+q.length)); }
/* After a render, scroll a thing into view and flash it; optionally focus it. */
function reveal(sel,focus){ requestAnimationFrame(()=>{ const el=$(sel); if(!el) return;
  const box=el.closest(".blk,li,section.panel,.panel")||el;
  box.scrollIntoView({block:"center",behavior:"smooth"});
  if(box.tagName!=="TR"){ box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); setTimeout(()=>box.classList.remove("flash"),1700); }
  if(focus){ try{ el.focus({preventScroll:true}); }catch(e){} } }); }
function focusMain(){ const w=$("#work"); if(w) try{ w.focus({preventScroll:true}); }catch(e){} }

/* ============================ COMMAND PALETTE (Ctrl+K) ============================ */
const pal={items:[],shown:[],sel:0,q:""};
let palOpener=null;
function palItems(){
  const it=[], go=(v,fn)=>()=>{ view=v; if(fn) fn(); render(); focusMain(); };
  VIEWS.forEach(v=>it.push({kind:"View",label:v.l,hint:v.g,run:go(v.k)}));
  SUBDOCS[S.kind].forEach(x=>it.push({kind:"Sub-document",label:x.l,run:go("write",()=>{ sub=x.k; })}));
  SUBDOCS[S.kind].forEach(x=>(S.subdocs[x.k]?.sections||[]).forEach(sec=>{
    it.push({kind:"Section",label:(secLevel(sec)>1?"— ".repeat(secLevel(sec)-1):"")+sec.title,hint:x.l,run:()=>{ sub=x.k; view="write"; render(); reveal(`[data-sectitle="${sec.id}"]`,true); }});
    (sec.blocks||[]).forEach(b=>{ if(b.type==="eq") it.push({kind:"Equation",label:`${b.label||"unlabelled"} — ${(b.latex||"").slice(0,60)}`,hint:x.l,
      run:()=>{ sub=x.k; view="write"; render(); reveal(`[data-eqtex="${sec.id}|${b.id}"]`,true); }}); }); }));
  (S.equations||[]).forEach(e=>it.push({kind:"Equation",label:(e.label||"draft")+" \u2014 "+(e.latex||"").slice(0,60),hint:"unplaced",
    run:go("equations",()=>{ ui.eq=e.id; })}));
  (S.samples||[]).forEach(sm=>it.push({kind:"Sample",label:sm.code+(sm.name?" — "+sm.name:""),run:()=>{ view="samples"; render(); reveal(`[data-sm="${sm.id}|code"]`,true); }}));
  refKeyMap();
  S.refs.forEach(r=>it.push({kind:"Reference",label:`${splitName(r.authors[0]||"").last} ${r.year} — ${r.title}`,hint:r._key,run:()=>{ ui.ref=r.id; view="refs"; render(); reveal(`[data-selref="${r.id}"]`); }}));
  const fnn=figNumbers(), tnn=tblNumbers();
  S.figures.forEach((f,i)=>it.push({kind:"Figure",label:`${capLabel("fig",fnn[f.ref],false)} — ${f.leadIn}`,hint:f.ref,run:go("figures",()=>{ ui.fig=f.id; })}));
  S.tables.forEach((t,i)=>it.push({kind:"Table",label:`${capLabel("tbl",tnn[t.ref],false)} — ${t.caption}`,hint:t.ref,run:go("tables",()=>{ ui.tbl=t.id; })}));
  S.plots.forEach(p=>it.push({kind:"Plot",label:p.name,hint:p.ref,run:go("plots",()=>{ ui.plot=p.id; })}));
  S.images.forEach(im=>it.push({kind:"Image",label:im.name,hint:im.ref,run:()=>{ view="plots"; render(); reveal(`[data-delimg="${im.id}"]`); }}));
  (S.defs||[]).forEach(d=>it.push({kind:"Acronym",label:`${d.short} — ${d.long}`,run:()=>{ view="defs"; render(); reveal(`[data-df="${d.id}|short"]`,true); }}));
  (S.styleLib||[]).forEach(e=>it.push({kind:"Style",label:e.label,hint:e.id===S.style?"in use":"use",run:()=>{ if(e.id!==S.style){ S.style=e.id; e.lastUsed=nowISO(); commit("Style: "+styleOf().label); } }}));
  TEMPLATES.forEach(t=>it.push({kind:"Template",label:t.label,hint:t.id===S.templateId?"in use":"",run:()=>{ view="templates"; render(); reveal(`[data-tpluse="${t.id}"]`); }}));
  S.revisions.forEach(r=>it.push({kind:"Revision",label:`${r.label} — ${fmtDate(r.at)}`,hint:r.by,run:go("drafts",()=>{ ui.diffA=r.id; })}));
  S.authors.forEach(a=>it.push({kind:"Author",label:a.name,run:()=>{ view="people"; render(); reveal(`[data-af="${a.id}|last"]`,true); }}));
  (S.peopleLib||[]).forEach(p=>it.push({kind:"Person",label:p.name||"(unnamed)",hint:"saved",
    run:()=>{ view="people"; render(); reveal(`[data-plf="${p.id}|name"]`,true); }}));
  const A=[["Undo",undo],["Redo",redo],["New document",openNewDoc],["Save revision",()=>$("#btnSaveRev").click()],
    ["Preview",()=>openPreview(sub)],["Export…",openExportMenu],
    ["Add section",()=>{ view="write"; addSection(); }],
    ["Import references (.ris)",openImportRIS],["Import reviewer report",openImportReview],
    ["Who is editing",()=>openIdentity()],["Guided tour",()=>tourGo(0)],["Keyboard shortcuts",openShortcuts]];
  if(vaultOnline()) A.push(["Documents",openDocuments]);
  A.forEach(([l,fn])=>it.push({kind:"Action",label:l,run:fn}));
  return it;
}
function openPalette(initial){
  closeAC(); if(!S) return;
  if(!$("#palHost").innerHTML) palOpener=document.activeElement;
  pal.items=palItems(); pal.q=initial||""; pal.sel=0;
  $("#palHost").innerHTML=`<div class="pal" id="pal"><div class="palbox" role="dialog" aria-modal="true" aria-label="Search">
    <input id="palQ" type="text" placeholder="Jump to a view, sample, reference, figure, table, section, style or action…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" aria-label="Search">
    <ul class="pallist" id="palList" role="listbox"></ul>
    <div class="palfoot"><span><kbd class="k">↑</kbd> <kbd class="k">↓</kbd> move</span><span><kbd class="k">Enter</kbd> open</span><span><kbd class="k">Esc</kbd> close</span><span style="margin-left:auto">${pal.items.length} things to jump to</span></div>
  </div></div>`;
  const q=$("#palQ"); q.value=pal.q;
  q.oninput=()=>{ pal.q=q.value; pal.sel=0; drawPal(); };
  q.onkeydown=e=>{ const n=pal.shown.length;
    if(e.key==="ArrowDown"){ e.preventDefault(); if(n) pal.sel=(pal.sel+1)%n; drawPal(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); if(n) pal.sel=(pal.sel-1+n)%n; drawPal(); }
    else if(e.key==="Enter"){ e.preventDefault(); palGo(pal.sel); }
    else if(e.key==="Tab"){ e.preventDefault(); } };
  $("#pal").addEventListener("mousedown",e=>{ if(e.target.id==="pal") closePalette(); });
  drawPal(); q.focus();
}
function drawPal(){
  const q=pal.q.trim();
  /* The kind word only matches as a prefix ("fig", "sample"), so "ti" does not
     surface every Action. */
  const score=it=>{ let s=fuzzy(q,it.label+" "+(it.hint||"")); if(s<0&&q&&it.kind.toLowerCase().startsWith(q.toLowerCase())) s=50; return s; };
  let list=pal.items.map(it=>({it,s:score(it)})).filter(x=>x.s>=0);
  if(q) list.sort((a,b)=>b.s-a.s);
  pal.shown=list.slice(0,q?40:400).map(x=>x.it);
  const host=$("#palList"); if(!host) return;
  let html="", lastKind=null;
  pal.shown.forEach((it,i)=>{ if(!q&&it.kind!==lastKind){ lastKind=it.kind; html+=`<li class="grp" role="presentation">${esc(it.kind)}${/s$/.test(it.kind)?"":"s"}</li>`; }
    html+=`<li role="option" id="palopt${i}" data-i="${i}" aria-selected="${i===pal.sel}"><span class="kind">${esc(it.kind)}</span><span class="lab">${hl(it.label,q)}</span>${it.hint?`<span class="hint">${esc(it.hint)}</span>`:""}</li>`; });
  host.innerHTML=html||`<li class="grp" role="presentation" style="text-transform:none;letter-spacing:0;font-size:12.5px;padding:14px 10px">Nothing matches “${esc(q)}”</li>`;
  $$("#palList li[data-i]").forEach(li=>{ li.onmousedown=e=>e.preventDefault(); li.onclick=()=>palGo(+li.dataset.i);
    li.onmousemove=()=>{ const i=+li.dataset.i; if(pal.sel!==i){ pal.sel=i; $$("#palList li[data-i]").forEach(x=>x.setAttribute("aria-selected",x===li)); } }; });
  const cur=$(`#palopt${pal.sel}`); if(cur) cur.scrollIntoView({block:"nearest"});
  const inp=$("#palQ"); if(inp) inp.setAttribute("aria-activedescendant",cur?cur.id:"");
}
function palGo(i){ const it=pal.shown[i]; if(!it) return; closePalette();
  try{ it.run(); }catch(e){ console.error(e); toast("That did not work: "+(e.message||e)); } }
function closePalette(){ const h=$("#palHost"); if(!h||!h.innerHTML) return; h.innerHTML="";
  const o=palOpener; palOpener=null; if(o&&document.contains(o)&&o!==document.body){ try{ o.focus({preventScroll:true}); }catch(e){} } }

/* ============================ INLINE REFERENCES: @ in a paragraph ============================
   Type @ and a few letters in any paragraph; the six token kinds are matched
   together — samples by code, citations by author and year, figures, tables,
   equations and acronyms by label. Enter inserts the id token; the text never
   holds a display string. */
let ac=null;
const KIND_WORD={sample:"sample",ref:"citation",fig:"figure",tbl:"table",eq:"equation",abbr:"acronym",wp:"work pkg",obj:"objective"};
function acItems(){
  const it=[];
  /* key: what the query matches; kw: kind words that match only as a prefix
     ("fig", "cit"), so a two-letter query is not swamped by kind names. */
  (S.samples||[]).forEach(sm=>it.push({kind:"sample",v:`[@sample:${sm.id}]`,label:sm.code+(sm.name?" — "+sm.name:""),key:`${sm.code} ${sm.name||""}`,kw:["sample"]}));

  $("#gApply").onclick=applyGrid;

function applyGrid(){
  const {plot,head,grid}=modalState;
  const num=v=>{ const f=parseFloat(v); return isFinite(f)?f:null; };
  const xs=[],rows=[];
  grid.forEach(r=>{ if(r.every(v=>String(v??"").trim()==="")) return; rows.push(r); });
  const isCat = rows.some(r=>String(r[0]).trim()!=="" && num(r[0])===null);
  rows.forEach(r=>xs.push(isCat? String(r[0]).trim() : num(r[0])));
  const series=[];
  for(let c=1;c<head.length;c++){
    const ys=rows.map(r=>num(r[c]));
    if(ys.every(v=>v===null)) continue;
    const old=plot.series[c-1]||{};
    const keep=rows.map((r,i)=>i).filter(i=>ys[i]!==null && (isCat||xs[i]!==null));
    series.push({ name:head[c]||("series "+c), x:keep.map(i=>xs[i]), y:keep.map(i=>ys[i]),
      colour:old.colour||PALETTE[(c-1)%PALETTE.length], fill:old.fill||false, gradient:old.gradient||false,
      fillOpacity:old.fillOpacity??.25, width:old.width||1.8, markers:old.markers||false, dashed:old.dashed||false });
  }
  if(!series.length){ toast("No numeric columns found"); return; }
  plot.series=series; plot.demo=false;
  if(isCat){ plot.xLabels=series[0].x.slice(); if(plot.chartType!=="bar"&&plot.chartType!=="pie") plot.chartType="bar"; }
  closeModal(); commit("Data applied — "+series.length+" series, "+series[0].x.length+" points",{undo:true});
}

   document, and an example must never overwrite real references or samples. */

  if(!vaultOnline()) return;
  let st=seed(); st.example=true; st.dir="";
  let lib={}; try{ lib=await DESK.library(); }catch(e){}

     example's library is all-or-nothing: bring it only into an empty library. */

    switchTo(created, libHas ? "Example loaded — its citations and samples resolve against your existing library, so some will show as missing" : "Example loaded"); }

/* Offer a generated file to the viewer. Falls back to the clipboard for text
   formats when the page has no save channel. */
async function saveFile(name,data,textFallback){
  if(typeof DESK!=="undefined" && DESK.online){
    try{ const r=await DESK.writeFile(name,data);
      if(r){ toast("Written to "+r.path.replace(/^.*[\\/]/,"")+" in the document folder"); return true; } }
    catch(e){ console.warn("vault write failed",e); }
  }
  const ns=await dlNamespace();
  if(ns){
    try{ const r=await ns.save({filename:name,data}); toast(r.status==="delivered"?"Sent to "+name:"Saved "+name); return true; }
    catch(e){
      const c=(e&&e.code)||"unavailable";
      if(c==="declined"){ toast("Save cancelled"); return false; }
      if(c==="rate_limited"){ toast("A save prompt is already open"); return false; }
      toast("Could not save "+name+" ("+c+")");
    }
  } else if(anchorSave(name,data)) { toast("Saved "+name); return true; }
  if(textFallback!=null){ copyText(textFallback); return false; }
  toast("Saving files is not available in this view");
  return false;
}
/* Plain browser download. Works when the page is opened as a local file or served
   normally; the artifact viewer blocks it, which is why the capability is tried first. */
function anchorSave(name,data){
  try{
    const blob = data instanceof Blob ? data : new Blob([data],{type:"text/html;charset=utf-8"});
    const u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=name; a.style.display="none";
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    return true;
  }catch(e){ return false; }
}
function copyText(text){

  function fb(){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.append(ta); ta.select(); try{document.execCommand("copy"); done();}catch(e){toast("Copy failed");} ta.remove(); }
}

/* The strip says which section is under the reader, so "+ Section" at the

let secObserver=null;
function trackSectionInView(){

  const out=$("#secWhere"); if(!out||typeof IntersectionObserver==="undefined") return;
  const seen=new Map();

    entries.forEach(en=>seen.set(en.target, en.isIntersecting?en.boundingClientRect.top:Infinity));
    let best=null, bestTop=Infinity;
    seen.forEach((top,el)=>{ if(top<bestTop&&top!==Infinity){ bestTop=top; best=el; } });
    const t=best&&best.querySelector("[data-sectitle]");
    out.textContent=t?t.value:"";

function moveBlock(sid,bid,delta){

  const sec=secs[si], i=sec.blocks.findIndex(b=>b.id===bid); if(i<0) return false;

  const tgt=secs[si+delta]; if(!tgt) return false;
