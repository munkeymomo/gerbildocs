/* save-status chip: refreshed by the bridge as saves happen, never by typing */
let saveStatus={state:"idle",lastSaved:null};
function refreshSaveStatus(st,extra){
  if(st){ saveStatus.state=st; if(extra&&extra.lastSaved) saveStatus.lastSaved=extra.lastSaved; }
  const c=$("#saveChip"); if(!c) return;
  if(typeof DESK==="undefined" || !DESK.online){ c.hidden=true; return; }
  c.hidden=false;
  if(!DESK.docId){ c.className="chip none"; c.textContent="Not in the vault yet"; c.title="Create or open a document; until then nothing is being saved"; return; }
  const t=saveStatus.lastSaved? saveStatus.lastSaved.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) : null;
  const m={dirty:["dirty","Unsaved changes","Will be saved in a moment"],
           saving:["saving","Saving…","Writing to the vault"],
           saved:["saved", t?"Saved "+t:"In the vault", "Your work is in the vault and mirrored into the document folder"],
           error:["error","Save failed — retrying","The last save did not reach the vault; it will be retried. Check the console if it persists."],
           idle:["saved","In the vault","Nothing unsaved"]}[saveStatus.state]||["","",""];
  c.className="chip "+m[0]; c.textContent=m[1]; c.title=m[2];
}
async function revealCurrent(){
  if(typeof DESK==="undefined" || !DESK.online || !DESK.docId) return;
  try{ await DESK.reveal(); }catch(e){ toast("Could not open the folder: "+(e.message||e)); }
}

  host.innerHTML=previewDoc(); }

function redrawPlot(){ const p=curPlot(); if(!p) return;
  const host=$(".figframe"); if(host) host.innerHTML=renderChart(p,{w:520,h:330});
  /* the group summaries read the same fields, so keep them honest without a render */

    data:`${p.chartType} · ${S1.length} series · ${S1.reduce((n,x)=>n+x.x.length,0)} points`,

    look:`${p.grid!==false?"gridlines":"no grid"} · ${p.legend!==false?"legend":"no legend"} · ${({axes:"axes only",box:"boxed",none:"no frame"})[p.frame||"axes"]}`,

  Object.keys(sums).forEach(k=>{ const el=$(`[data-pgrp="${k}"] .sum`); if(el) el.textContent=sums[k]; }); }


/* ============================ DESKTOP BRIDGE ============================
   Inert when the page is opened on its own. When the desktop backend serves
   it, state lives in the vault and exports are written into the document
   folder instead of coming down as browser downloads. */
const DESK = (() => {
  const api = window.__DESK_API || null;
  const token = window.__DESK_TOKEN || null;
  let docId = null, online = false, info = {};
  /* save queue: one write in flight, the newest state waiting behind it, and
     the document it belongs to captured at queue time so switching documents
     mid-save can never write A's state into B. */
  let pending = null, pendingDoc = null, timer = null, inflight = null, retryTimer = null;
  let lastSaved = null, lastError = null;
  const listeners = [];
  function notify(state) { listeners.forEach(fn => { try { fn(state, { lastSaved, lastError }); } catch (e) {} }); }

  const headers = () => ({ "Content-Type": "application/json",
                           "Authorization": "Bearer " + token });
  async function req(path, opts) {
    const r = await fetch(api + path, Object.assign({ headers: headers() }, opts || {}));
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 240));
    return r.status === 204 ? null : r.json();
  }
  async function form(path, fd) {
    const r = await fetch(api + path, { method: "POST", body: fd,
                                        headers: { "Authorization": "Bearer " + token } });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 240));
    return r.json();
  }
  function push() {
    if (inflight || pending === null) return inflight;
    const body = pending, id = pendingDoc; pending = null; pendingDoc = null;
    inflight = (async () => {
      notify("saving");
      try {
        await req("/documents/" + id, { method: "PUT", body: JSON.stringify({ state: body }) });
        lastSaved = new Date(); lastError = null;
        notify(pending !== null ? "dirty" : "saved");
      } catch (e) {
        lastError = e; console.warn("save failed", e);
        if (pending === null) { pending = body; pendingDoc = id; }  // keep it for the retry
        notify("error");
        retryTimer = setTimeout(() => { retryTimer = null; push(); }, 5000);
      } finally { inflight = null; }
      if (pending !== null && !retryTimer && !timer) push();
    })();
    return inflight;
  }
  async function flush() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    for (let i = 0; i < 3 && (inflight || pending !== null); i++) await (inflight || push());
  }
  /* Last-chance write when the window closes. keepalive lets the request
     outlive the page; the token goes in the query string since sendBeacon
     cannot set headers and PUT needs fetch anyway. */
  window.addEventListener("pagehide", () => {
    if (!online || pending === null || !pendingDoc) return;
    try { fetch(api + "/documents/" + pendingDoc + "?t=" + encodeURIComponent(token),
                { method: "PUT", keepalive: true, headers: headers(),
                  body: JSON.stringify({ state: pending }) }); } catch (e) {}
  });

  return {
    get online() { return online; },
    get docId() { return docId; },
    get info() { return info; },
    get notices() { return ((info.vault || {}).notices) || []; },
    get folderDialog() { return !!info.folder_dialog; },
    get documentsDir() { return info.documents_dir || window.__DESK_DOCUMENTS_DIR || ""; },
    onStatus(fn) { listeners.push(fn); },

    async connect() {
      if (!api || !token) return false;
      try { info = await req("/health"); online = !!info.ok; } catch (e) { online = false; info = {}; }
      return online;
    },
    /* Most recently opened document, or null if the vault is empty. */
    async openLatest() {
      const { documents } = await req("/documents");
      if (!documents.length) return null;
      return this.open(documents[0].id);
    },
    async open(id) {
      await flush();
      const d = await req("/documents/" + id);
      docId = d.id; lastSaved = null; notify("saved");
      return d.state;
    },
    async list() { return (await req("/documents")).documents; },
    async discover() { return (await req("/documents/discover")).documents; },
    async libraryRoots() { return (await req("/library-roots")).roots; },
    async setLibraryRoots(roots) { return (await req("/library-roots", { method: "PUT", body: JSON.stringify({ roots }) })).roots; },
    async folderTree(baseDir) { return req("/documents/tree?base_dir=" + encodeURIComponent(baseDir || "")); },
    async library() { return (await req("/library")).library; },
    async create(title, kind, state, baseDir) {
      await flush();
      const d = await req("/documents", { method: "POST",
        body: JSON.stringify({ title, kind, state: state || {}, base_dir: baseDir || null }) });
      docId = d.id; lastSaved = new Date(); notify("saved");
      return d.state;
    },
    async adopt(root) {
      await flush();
      const d = await req("/documents/adopt", { method: "POST", body: JSON.stringify({ root }) });
      docId = d.id; lastSaved = null; notify("saved");
      return d;
    },
    /* Coalesced: rapid edits produce one write, and one in flight at a time. */
    saveState(state) {
      if (!online || !docId) return;
      pending = state; pendingDoc = docId;
      notify("dirty");
      if (!timer && !inflight && !retryTimer) timer = setTimeout(() => { timer = null; push(); }, 600);
    },
    flush,
    async reveal(id) {
      const target = id || docId;
      if (!online || !target) return null;
      return req("/documents/" + target + "/reveal", { method: "POST" });
    },
    async revealFolder(target) {
      if (!online) return null;
      return req("/reveal?target=" + encodeURIComponent(target || "documents"), { method: "POST" });
    },
    async pickFolder() {
      if (!online || !info.folder_dialog) return null;
      return (await req("/dialog/folder", { method: "POST" })).path || null;
    },
    async writeFile(relative, data) {
      if (!online || !docId) return null;
      let body;
      if (typeof data === "string") body = { relative, text: data };
      else body = { relative, base64: await toBase64(data) };
      return req("/documents/" + docId + "/files", { method: "POST", body: JSON.stringify(body) });
    },
    async uploadAttachment(target, attachmentId, file, note) {
      if (!online || !docId) return null;
      const fd = new FormData();
      fd.append("target", target); fd.append("attachment_id", attachmentId);
      fd.append("note", note || ""); fd.append("upload", file, file.name);
      return form("/documents/" + docId + "/attachments", fd);
    },
    async addRevision(revision) {
      if (!online || !docId) return null;
      return req("/documents/" + docId + "/revisions", { method: "POST",
        body: JSON.stringify({ revision }) });
    },
    async tree() {
      if (!online || !docId) return null;
      return req("/documents/" + docId + "/tree");
    },
    /* The interface renders; the backend files it at the planned paths and
       hands back the tree, so the browser does not have to ask twice. */
    async compileDeposit(rendered) {
      if (!online || !docId) return null;
      return req("/documents/" + docId + "/deposit", { method: "POST",
        body: JSON.stringify({ rendered: rendered || {} }) });
    },
    /* Hand a URL to the system browser. The route may not exist in an older
       backend, so any failure falls back to the page's own window.open. */
    async openExternal(url) {
      if (!url) return false;
      if (online) {
        try {
          const r = await fetch(api + "/open-url", { method: "POST", headers: headers(),
                                                     body: JSON.stringify({ url }) });
          if (r.ok) return true;
        } catch (e) {}
      }
      try { window.open(url, "_blank", "noopener"); } catch (e) {}
      return false;
    }
  };
  function toBase64(data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(",")[1]);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }
})();

/* Called by the MathJax startup hook once the (local or CDN) bundle is ready. */
window.__deskMathReady=function(){ mathReady=true; try{ if(S) render(); }catch(e){} };

async function boot(){
  let remote=null, vaultEmpty=false;
  if(await DESK.connect()){
    S_EDITION_ONLINE=true;
    DESK.onStatus(refreshSaveStatus);
    try{ remote=await DESK.openLatest(); vaultEmpty=!remote; }
    catch(e){ console.warn("vault unreadable",e); }
    /* Desktop edition: the vault is the only source. An empty vault gets the
       start screen, not the example — that is loaded on request. */
    S = remote || blankState("publication","Untitled publication");
  } else {
    S = load() || seed();
  }
  migrate();
  refKeyMap();
  wireContextMenu();
  render();
  histReset();
  if(DESK.online){
    if(!remote) openStart(); else showVaultNotices();
  }
}
function migrate(){
  const d=seed(), online=vaultOnline();
  /* Standalone: missing fields are back-filled from the example, as they always
     were for Mark's saved document. Vault: back-fill is empty — a real document
     must never acquire the example's samples or acronyms. Built-in styles are
     not example data and are supplied in both. */
  const fill = online ? {me:{name:"",initials:"",colour:EDCOLOURS[0]},sampleProps:[],samples:[],defs:[],tables:[],attachments:[]} : d;
  if(!S.styleLib||!S.styleLib.length){ S.styleLib=d.styleLib; S.style=({afm:"st_afm",acs:"st_acs",rsc:"st_rsc",apa:"st_apa"})[S.style]||"st_afm"; }
  else { // add styles shipped since this vault was written, keep the user's own
    const haveBase=new Set(S.styleLib.map(x=>x.base));
    d.styleLib.filter(x=>!haveBase.has(x.base)).forEach(x=>S.styleLib.push(x));
  }
  if(!(S.styleLib||[]).some(x=>x.id===S.style)) S.style=S.styleLib[0].id;
  if(S.abstract===undefined) S.abstract= online ? "" : d.abstract;
  ["me","sampleProps","samples","defs","tables","attachments"].forEach(k=>{ if(!S[k]) S[k]=fill[k]; });
  ["plots","images","figures","refs","revisions","reviews","authors","orgs","keywords"].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  /* An author used to hold one organisation id in `org`. They may now hold
     several, in the order they want them shown, so the old field becomes a
     one-element list and goes. */
  S.authors.forEach(a=>{
    if(!Array.isArray(a.orgs)) a.orgs = (typeof a.org==="string"&&a.org) ? [a.org] : [];
    delete a.org;
    if(!Array.isArray(a.credit)) a.credit=[];
    /* An author used to be one `name` string. Split it once, keeping `name`
       in step, so a document written before the byline understood name order
       gains the parts without the person retyping anybody. */
    if(a.last===undefined && a.first===undefined){
      const np=parsePersonName(a.name); a.first=np.first; a.initials=np.initials; a.last=np.last;
      syncAuthorName(a);
    }
  });
  (S.peopleLib||[]).forEach(p=>{ if(p.last===undefined && p.first===undefined){
    const np=parsePersonName(p.name); p.first=np.first; p.initials=np.initials; p.last=np.last; p.name=authorName(p); } });
  /* Organisations gained a postcode; an older one simply has none. */
  (S.orgs||[]).forEach(o=>{ if(o.postcode===undefined) o.postcode=""; });
  (S.orgLib||[]).forEach(o=>{ if(o.postcode===undefined) o.postcode=""; });
  /* Saved people and organisations are app-scoped (store.LIBRARY_KEYS) and
     start empty in both editions — never back-filled from the example. */
  if(!Array.isArray(S.peopleLib)) S.peopleLib=[];
  if(!Array.isArray(S.orgLib)) S.orgLib=[];
  /* Placement and width are per figure only when set; unset ones follow the
     document format (Formatting view). Documents saved before that existed
     had every figure stamped inline/double — those stamps stay as the
     figure's own choice, which is what they were. */
  if(S.format===undefined||S.format===null||typeof S.format!=="object") S.format={};
  if(!S.project||typeof S.project!=="object") S.project={aim:"",objectivesTitle:"Aims and objectives",showObjectives:false,objectives:[],wps:[],milestones:[],gantt:{months:36,start:"",unit:"month"}};
  if(!Array.isArray(S.equations)) S.equations=[];
  if(!Array.isArray(S.templates)) S.templates=[];
  if(!Array.isArray(S.folders)) S.folders=["Unfiled"];
  if(!S.edition) S.edition="desktop";
  if(S.example===undefined) S.example=false;
  if(S.dir===undefined) S.dir="";
  /* The language a document is written in. Existing documents were written
     against the browser's default, which on this machine is British English;
     saying so is closer to the truth than leaving it unset. */
  if(!S.lang) S.lang="en-GB";
  if(S.depositAt===undefined) S.depositAt="";
  if(S.templateId===undefined) S.templateId=null;
  if(S.glossary===undefined) S.glossary=false;
  if(S.redefineInSI===undefined) S.redefineInSI=true;
  if(S.runningHead===undefined) S.runningHead= online ? "" : d.runningHead;
  /* A document created through the API alone has no sub-documents yet. */
  if(!SUBDOCS[S.kind]) S.kind="publication";
  if(!S.subdocs||typeof S.subdocs!=="object") S.subdocs={};
  SUBDOCS[S.kind].forEach(x=>{ if(!S.subdocs[x.k]) S.subdocs[x.k]={sections:[{id:uid("s"),kind:"heading",title:x.l,blocks:[{id:uid("b"),type:"p",text:""}]}]}; });
  if(typeof S.title!=="string") S.title="Untitled";
  Object.values(S.subdocs||{}).forEach(sd=>(sd.sections||[]).forEach(sec=>{
    if(sec.kind==="experimental"&&!sec.role){ sec.role="experimental"; sec.placement="end"; }
    if(!sec.level) sec.level=1; }));
  if(!S.ensImport) S.ensImport=ENS_SAMPLE;
  save();
}
let S_EDITION_ONLINE=false;
boot();

window.addEventListener("keydown",e=>{
  const mod=e.ctrlKey||e.metaKey, ed=isEditing(document.activeElement);
  if(e.key==="Escape"){
    if($("#acHost").innerHTML){ closeAC(true); return; }
    if($("#palHost").innerHTML){ closePalette(); return; }
    if($("#pvHost")) closePreview();
    else if(!$("#startScrim")){ closeModal(); if(vaultOnline()&&!DESK.docId) openStart(); }
    return; }
  if(mod&&!e.altKey&&(e.key==="k"||e.key==="K")){ e.preventDefault(); if($("#palHost").innerHTML) closePalette(); else openPalette(); return; }
  if(mod&&e.key==="/"){ e.preventDefault(); openShortcuts(); return; }
  if($("#palHost").innerHTML||$("#startScrim")) return;
  /* Mid-burst in a text field the browser's own undo is better — it keeps the
     caret. Once that field's edits have become a step of ours, ours takes over. */
  const nativeUndo = ed&&hist.dirty&&hist.typeTarget===document.activeElement;
  if(mod&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){ if(nativeUndo) return; e.preventDefault(); undo(); return; }
  if(mod&&((e.shiftKey&&(e.key==="z"||e.key==="Z"))||e.key==="y"||e.key==="Y")){ if(nativeUndo) return; e.preventDefault(); redo(); return; }
  if(mod&&(e.key==="s"||e.key==="S")){ e.preventDefault(); $("#btnSaveRev").click(); return; }
  if(mod&&(e.key==="p"||e.key==="P")){ e.preventDefault(); if(!$("#pvHost")) openPreview(sub); return; }

/* Focus survives a full render when the element can be found again by id or data attribute. */
function focusKey(el){ if(!el||el===document.body) return null; if(el.id) return "#"+CSS.escape(el.id);
  for(const a of el.attributes){ if(a.name.startsWith("data-")&&a.value) return `[${a.name}="${a.value.replace(/"/g,'\\"')}"]`; } return null; }
function refocus(key,pos){ if(!key) return false; const el=$(key); if(!el) return false;
  try{ el.focus({preventScroll:true}); if(pos!=null&&el.setSelectionRange){ const p=Math.min(pos,(el.value||"").length); el.setSelectionRange(p,p); } }catch(e){} return true; }
